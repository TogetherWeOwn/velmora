name: ci

# `ci-ok` is the aggregate check meant to be required on main: its NAME must
# stay `ci-ok`, and every gating job id must be listed in its `needs`.
# Patterns (pinned actions, cache policy, pinned cargo-deny, fail-closed
# aggregate) are copied from nntunev2's ci.yml at the extraction baseline.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Merge queue validation: every required check must report on the queue's
  # temporary merge commit. merge_group runs are never cancelled.
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # merge_group refs are per-queue-entry and must run to completion.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.event_name != 'merge_group' }}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  public-pr-security:
    if: github.event_name == 'pull_request' && github.event.repository.private == false
    # The nested OSV reusable requires this exact permission ceiling: actions
    # reads same-run comparison artifacts, contents reads the PR tree/history,
    # and security-events uploads comparison SARIF. No secrets are passed.
    permissions:
      actions: read # Nested OSV reads same-run comparison artifacts.
      contents: read
      security-events: write # Nested OSV uploads comparison SARIF.
    uses: TogetherWeOwn/.github/.github/workflows/public-pr-security.yml@feb1e0e2111da007f38ca75ee95c6f6944723d36 # v0.5.0

  rust-test:
    name: rust test (native)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --component rustfmt,clippy
          rustup default stable
      # rust-cache policy: PR and merge-queue runs restore main's cache but
      # only main saves, so per-PR copies do not evict main's entries.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # Reference PAR2 binary for the creator interop test
      # (`interop_repair_with_reference_binary_when_available`, which repairs
      # a creator-emitted set through the repair path and skips when no
      # binary is present). Distro par2cmdline proves spec-level interop of
      # the emitted bytes.
      - name: Install reference par2 binary for creator interop test
        run: sudo apt-get update && sudo apt-get install -y par2
      - run: cargo test --locked --workspace
      # Transport-free portable core on the same native runner: executes
      # velmora without default TLS features. This is native portable
      # behavior, not a wasm-runtime check (see rust-wasm).
      - run: cargo test --locked -p velmora --no-default-features
      - run: cargo clippy --locked -p velmora --no-default-features --features archive-provider --lib -- -D warnings
      - run: 'cargo test --locked -p velmora --no-default-features --features archive-provider --lib archive::'
      - run: cargo test --locked -p velmora --no-default-features --features archive-provider --test archive_provider
      # Exercise the preserved native TLS tests with the qualification feature
      # enabled as well. This does not execute the wasm-only Worker adapter.
      - run: cargo test --locked -p velmora --features worker-pinned-tls --lib

  rust-wasm:
    name: rust check (wasm32)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --component clippy --target wasm32-unknown-unknown
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Scalar core (no transport features) and the Workers transport build.
      - run: cargo check --locked -p velmora --target wasm32-unknown-unknown --no-default-features
      - run: cargo check --locked -p velmora --target wasm32-unknown-unknown --no-default-features --features worker-transport
      - run: cargo clippy --locked -p velmora --target wasm32-unknown-unknown --no-default-features --features worker-transport -- -D warnings
      # The simd128 yEnc fast path must keep compiling (Workers run V8 with
      # Wasm SIMD; consumers enable it via this RUSTFLAGS).
      - run: RUSTFLAGS="-C target-feature=+simd128" cargo check --locked -p velmora --target wasm32-unknown-unknown --no-default-features
      # S3 bridge core and protocol crates are runtime-agnostic and must
      # build for the Worker target without engine transport features.
      - run: cargo check --locked -p velmora-bridge -p velmora-s3-proto --target wasm32-unknown-unknown
      - run: cargo clippy --locked -p velmora-bridge -p velmora-s3-proto --target wasm32-unknown-unknown -- -D warnings

  # Clean, uncached compile of the preserved qualification-only Worker slice.
  # Compilation is not Worker entropy/clock, dialing or physical-close evidence.
  rust-worker-pinned-tls:
    name: rust check (Worker pinned TLS, compile only)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CC_wasm32_unknown_unknown: clang-18
      AR_wasm32_unknown_unknown: llvm-ar-18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The locked Worker SDK 0.8.7 requires Rust 1.91. Check its feature graph
      # at that minimum instead of raising the default/portable core MSRV.
      - name: Install Rust 1.91 (Worker SDK minimum)
        run: |
          rustup toolchain install 1.91 --profile minimal --no-self-update --component clippy --target wasm32-unknown-unknown
          rustup default 1.91
      - name: Install pinned Wasm C toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 llvm-18 lld-18
          clang-18 --version
          llvm-ar-18 --version
          wasm-ld-18 --version
      - run: cargo fetch --locked
      - run: cargo check --locked -p velmora-ssrf-guard --target wasm32-unknown-unknown
      # Check default native-tls alone before Worker features can mask missing
      # Wasm backend wiring through Cargo feature unification.
      - run: cargo check --locked -p velmora --target wasm32-unknown-unknown
      - run: cargo check --locked -p velmora --target wasm32-unknown-unknown --no-default-features --features worker-pinned-tls
      - run: cargo clippy --locked -p velmora --target wasm32-unknown-unknown --no-default-features --features worker-pinned-tls -- -D warnings
      # Retain compatibility when consumers leave native-tls enabled on wasm.
      - run: cargo check --locked -p velmora --target wasm32-unknown-unknown --all-features

  # MSRV gate: `rust-version` in crates/velmora/Cargo.toml must build the
  # locked dependency graph. Bump both together when the lockfile needs a
  # newer toolchain.
  rust-msrv:
    name: rust check (msrv)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.89 (velmora rust-version)
        run: |
          rustup toolchain install 1.89 --profile minimal --no-self-update
          rustup default 1.89
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --locked -p velmora
      - run: cargo check --locked -p velmora --no-default-features
      - run: cargo check --locked -p velmora-ssrf-guard
      # Bridge core and protocol crates declare the same 1.89 MSRV.
      - run: cargo check --locked -p velmora-s3-proto -p velmora-bridge
      - name: Install Rust 1.91 (Worker SDK minimum)
        run: |
          rustup toolchain install 1.91 --profile minimal --no-self-update
          rustup default 1.91
      - run: cargo check --locked -p velmora --features worker-pinned-tls
      # The S3 Worker crate declares rust-version 1.91 (workers-rs 0.8.7).
      - run: cargo check --locked -p velmora-s3-bridge

  # Dependency/security gate: the reviewed deny.toml policy must pass for
  # the committed lockfile. Findings are fixed by updating the dependency,
  # never by weakening the policy. Keep this job id in ci-ok's needs.
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - name: Install pinned cargo-deny 0.20.2
        run: |
          set -euo pipefail
          deny_version="0.20.2"
          asset="cargo-deny-${deny_version}-x86_64-unknown-linux-musl.tar.gz"
          base="https://github.com/EmbarkStudios/cargo-deny/releases/download/${deny_version}"
          # Pinned digest recorded in-repo so a replaced release artifact
          # fails closed instead of executing. Re-pin deliberately when the
          # version above changes, verifying the digest out-of-band first.
          expected_sha256="9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"
          curl -fsSL --connect-timeout 10 --max-time 30 --retry 3 \
            -o "/tmp/${asset}" "${base}/${asset}"
          echo "${expected_sha256}  /tmp/${asset}" | (cd /tmp && sha256sum -c -)
          mkdir -p "$HOME/.cargo/bin"
          tar -xzf "/tmp/${asset}" -C /tmp
          install -m 755 "/tmp/cargo-deny-${deny_version}-x86_64-unknown-linux-musl/cargo-deny" "$HOME/.cargo/bin/cargo-deny"
          cargo-deny --version
      # Fail-closed freshness: the committed lockfile must match the
      # manifests, or the audit below would check a stale dependency set.
      - name: Prove the committed lockfile is fresh
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Audit advisories, bans, licenses, sources
        run: cargo-deny --manifest-path Cargo.toml check

  # Path filter for the S3 bridge jobs below. Pull requests that touch only
  # files outside the Rust workspace (docs, READMEs, other workflows) skip
  # them; every other event runs them. Plain git, no third-party action. A
  # failure here fails ci-ok, so a broken filter can never skip a job.
  changes:
    name: changes (bridge paths)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      bridge: ${{ steps.filter.outputs.bridge }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR merge commit and its first parent (the base tip).
          fetch-depth: 2
          persist-credentials: false
      - id: filter
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$CI_EVENT_NAME" != "pull_request" ]; then
            echo "bridge=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only HEAD^1 HEAD)
          if grep -qE '^(Cargo\.toml|Cargo\.lock|deny\.toml|\.github/workflows/ci\.yml|crates/|workers/s3-bridge/)' <<< "$changed"; then
            echo "bridge=true" >> "$GITHUB_OUTPUT"
          else
            echo "bridge=false" >> "$GITHUB_OUTPUT"
          fi

  # S3 bridge core: contract tests (rusqlite Sql, in-memory blobs, fakes)
  # and, as lanes land, NntpClient against the in-process test server.
  bridge-native:
    name: bridge native tests
    needs: changes
    if: needs.changes.outputs.bridge == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --component clippy
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --locked -p velmora-s3-proto -p velmora-bridge
      - run: cargo clippy --locked -p velmora-s3-proto -p velmora-bridge --all-targets --features velmora-bridge/testkit -- -D warnings
      - run: cargo build --locked -p velmora-test-nntp --bin fakesrv

  # The S3 Worker bundle: wasm clippy with the request-target lint
  # (workers/s3-bridge/clippy.toml bans worker::Request::url), worker-build, size budget.
  worker-build:
    name: worker build (s3-bridge)
    needs: changes
    if: needs.changes.outputs.bridge == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --component clippy --target wasm32-unknown-unknown
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Matches the locked workers-rs 0.8.7 and wrangler.toml [build].
      - name: Install pinned worker-build 0.8.7
        run: cargo install --locked worker-build --version 0.8.7
      - run: cargo clippy --locked -p velmora-s3-bridge --target wasm32-unknown-unknown -- -D warnings
      - name: Build the Worker bundle
        working-directory: workers/s3-bridge
        run: worker-build --release
      - name: Size budget (index_bg.wasm under 3 MB)
        working-directory: workers/s3-bridge
        run: |
          set -euo pipefail
          size=$(stat -c %s build/index_bg.wasm)
          echo "index_bg.wasm: ${size} bytes (budget 3000000)"
          test "$size" -lt 3000000

  # Local end-to-end slice under `wrangler dev` with the fake NNTP server.
  # Passes with "skipped: no script" until workers/s3-bridge/e2e/slice.sh
  # exists. The script runs from workers/s3-bridge as
  # `bash e2e/slice.sh http://127.0.0.1:8787`; it starts fakesrv
  # ($FAKESRV_BIN), applies migrations --local (dev database
  # `velmora-catalog-dev`) and starts
  # `npx wrangler@4 dev --env dev --local --test-scheduled --port 8787`.
  worker-e2e:
    name: worker e2e (wrangler dev)
    needs: changes
    if: needs.changes.outputs.bridge == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: script
        run: |
          if [ -f workers/s3-bridge/e2e/slice.sh ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "skipped: no script"
          fi
      - name: Install Rust stable
        if: steps.script.outputs.present == 'true'
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --target wasm32-unknown-unknown
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.script.outputs.present == 'true'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install pinned worker-build 0.8.7
        if: steps.script.outputs.present == 'true'
        run: cargo install --locked worker-build --version 0.8.7
      - name: Install pinned aws-cli 2.31.23
        if: steps.script.outputs.present == 'true'
        run: |
          set -euo pipefail
          zip="awscli-exe-linux-x86_64-2.31.23.zip"
          # Digest of the release zip, recorded after verifying its PGP
          # signature against the AWS CLI Team key (fingerprint
          # FB5D B77F D5C1 18B8 0511 ADA8 A631 0ACC 4672 475C) out of band.
          # A replaced artifact fails closed here.
          expected_sha256="eca61882437a815d7a7df9e70982a71cdaef0c4061cf4fb63a07726bd6dfee08"
          curl -fsSL --connect-timeout 10 --max-time 120 --retry 3 -o "/tmp/${zip}" "https://awscli.amazonaws.com/${zip}"
          echo "${expected_sha256}  /tmp/${zip}" | (cd /tmp && sha256sum -c -)
          unzip -q "/tmp/${zip}" -d /tmp/awscli
          sudo /tmp/awscli/aws/install --update
          aws --version
      - name: Build fakesrv
        if: steps.script.outputs.present == 'true'
        run: cargo build --locked -p velmora-test-nntp --bin fakesrv
      - name: Run the local slice
        if: steps.script.outputs.present == 'true'
        working-directory: workers/s3-bridge
        env:
          FAKESRV_BIN: ${{ github.workspace }}/target/debug/fakesrv
          WRANGLER_SEND_METRICS: "false"
        run: bash e2e/slice.sh http://127.0.0.1:8787

  ci-ok:
    name: ci-ok
    needs: [rust-test, rust-wasm, rust-worker-pinned-tls, rust-msrv, cargo-deny, public-pr-security, changes, bridge-native, worker-build, worker-e2e]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          # Only the PR-only caller may skip, and only outside pull_request.
          # A private PR skips the caller but fails ci-ok without scanning.
          # The path-filtered bridge jobs must succeed when the filter says
          # bridge=true and must be skipped (not failed or cancelled) when it
          # says bridge=false; the filter job itself must succeed.
          if ! jq -e --arg event "$CI_EVENT_NAME" --arg bridge "$BRIDGE" '
            . as $n |
            ["bridge-native", "worker-build", "worker-e2e"] as $filtered |
            ($n | length) > 1 and
            $n["public-pr-security"].result == (if $event == "pull_request" then "success" else "skipped" end) and
            $n.changes.result == "success" and
            ($bridge == "true" or $bridge == "false") and
            all($filtered[]; $n[.].result == (if $bridge == "true" then "success" else "skipped" end)) and
            ($n | del(.["public-pr-security"]) | del(.[$filtered[]]) | all(.[]; .result == "success"))
          ' <<< "$NEEDS_JSON" > /dev/null; then
            echo "ci-ok: a required job did not succeed"
            exit 1
          fi
          echo "ci-ok: all required jobs passed"
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          CI_EVENT_NAME: ${{ github.event_name }}
          BRIDGE: ${{ needs.changes.outputs.bridge }}

  # Production deploy of the S3 Worker after ci-ok on a push to main, in two
  # jobs. They depend on ci-ok, never the reverse, and are not part of
  # ci-ok. `!cancelled()` is needed because the PR-only public-pr-security
  # job is a skipped ancestor, which would make the implicit success()
  # skip these jobs.
  #
  # deploy-build compiles the Worker with no environment and no secrets,
  # and hands the bundle to deploy as an artifact. deploy runs in the
  # protected `production` environment (main only) and executes no cargo,
  # build.rs or worker-build code. Wrangler comes from the committed
  # workers/s3-bridge/package-lock.json, installed with `npm ci
  # --ignore-scripts` before any credential is in env. The Cloudflare token
  # and account id reach only the wrangler steps that call the API, through
  # env, never argv. Worker secrets are never read, written or listed.
  #
  # D1 migrations must be additive-only (expand, then contract in a later
  # release): they run before the new version goes live, and a rollback
  # restores the previous Worker version but never reverts a migration.
  deploy-build:
    name: deploy build (s3-bridge bundle)
    needs: [ci-ok, changes]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.bridge == 'true' && needs.changes.result == 'success' && needs.ci-ok.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      fresh: ${{ steps.fresh.outputs.fresh }}
    steps:
      # Stale-run guard: build and deploy only while this commit is still
      # the tip of main, so an older run never replaces a newer release.
      - id: fresh
        name: Check that this commit is still the tip of main
        run: |
          set -euo pipefail
          tip=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}" refs/heads/main | cut -f1)
          if [ "$tip" = "$GITHUB_SHA" ]; then
            echo "deploy: ${GITHUB_SHA} is the tip of main"
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "skipped: main moved from ${GITHUB_SHA} to ${tip}; the newer run deploys"
            echo "fresh=false" >> "$GITHUB_OUTPUT"
            echo "Deploy skipped: main moved to \`${tip}\`; the newer run deploys." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.fresh.outputs.fresh == 'true'
        with:
          persist-credentials: false
      # No build cache: a deploy never restores a cache another run wrote.
      - name: Install Rust stable
        if: steps.fresh.outputs.fresh == 'true'
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --target wasm32-unknown-unknown
          rustup default stable
      # Matches the locked workers-rs 0.8.7 and wrangler.toml [build].
      - name: Install pinned worker-build 0.8.7
        if: steps.fresh.outputs.fresh == 'true'
        run: cargo install --locked worker-build --version 0.8.7
      - name: Build the Worker bundle
        if: steps.fresh.outputs.fresh == 'true'
        working-directory: workers/s3-bridge
        run: worker-build --release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.fresh.outputs.fresh == 'true'
        with:
          name: s3-bridge-bundle
          path: workers/s3-bridge/build/
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: deploy (production)
    needs: [deploy-build]
    if: ${{ !cancelled() && needs.deploy-build.result == 'success' && needs.deploy-build.outputs.fresh == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
    # One production deploy at a time; a running deploy is never cancelled.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      # Re-check after the build and the concurrency wait.
      - id: fresh
        name: Check that this commit is still the tip of main
        run: |
          set -euo pipefail
          tip=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}" refs/heads/main | cut -f1)
          if [ "$tip" = "$GITHUB_SHA" ]; then
            echo "deploy: ${GITHUB_SHA} is the tip of main"
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          else
            echo "skipped: main moved from ${GITHUB_SHA} to ${tip}; the newer run deploys"
            echo "fresh=false" >> "$GITHUB_OUTPUT"
            echo "Deploy skipped: main moved to \`${tip}\`; the newer run deploys." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.fresh.outputs.fresh == 'true'
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.fresh.outputs.fresh == 'true'
        with:
          name: s3-bridge-bundle
          path: workers/s3-bridge/build
      # Pinned wrangler from the committed lockfile; no install scripts run,
      # and no credentials are in env.
      - name: Install pinned wrangler (npm ci)
        if: steps.fresh.outputs.fresh == 'true'
        working-directory: workers/s3-bridge
        run: npm ci --ignore-scripts --no-audit --no-fund
      # Writes wrangler.deploy.toml: fills the prod S3_HOST and the prod
      # (first) database_id placeholder, each of which must appear exactly
      # once before the first [env.*] table, and drops the prod [build]
      # table so wrangler uploads the downloaded bundle and runs no
      # repository build code. Values must be a valid hostname and a UUID,
      # so nothing else can be injected into the TOML. Values are never
      # printed. Pure Python, no repository code.
      - name: Generate the production wrangler config
        if: steps.fresh.outputs.fresh == 'true'
        working-directory: workers/s3-bridge
        env:
          VELMORA_S3_HOST: ${{ vars.VELMORA_S3_HOST }}
          VELMORA_D1_DATABASE_ID: ${{ vars.VELMORA_D1_DATABASE_ID }}
        run: |
          set -euo pipefail
          python3 -I - wrangler.toml wrangler.deploy.toml <<'PY'
          import os, re, sys

          src, dst = sys.argv[1], sys.argv[2]
          host = os.environ.get("VELMORA_S3_HOST", "")
          dbid = os.environ.get("VELMORA_D1_DATABASE_ID", "")
          label = r"[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?"
          if len(host) > 253 or not re.fullmatch(rf"{label}(\.{label})+", host):
              sys.exit("VELMORA_S3_HOST is missing or not a plain lowercase hostname")
          if not re.fullmatch(r"[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}", dbid):
              sys.exit("VELMORA_D1_DATABASE_ID is missing or not a lowercase UUID")

          with open(src, encoding="utf-8") as f:
              lines = f.read().split("\n")
          header = re.compile(r"\s*\[")
          # The prod section ends at the first [env.*] table header.
          end = next((i for i, l in enumerate(lines)
                      if re.match(r"\s*\[\[?env\.", l)), len(lines))
          subs = [
              ('S3_HOST = "velmora-s3.<account>.workers.dev"', f'S3_HOST = "{host}"'),
              ('database_id = "<from wrangler d1 create>"', f'database_id = "{dbid}"'),
          ]
          for placeholder, value in subs:
              hits = [i for i in range(end) if lines[i].strip() == placeholder]
              if len(hits) != 1:
                  sys.exit(f"expected exactly one prod line {placeholder!r}, found {len(hits)}")
              i = hits[0]
              lines[i] = lines[i][: len(lines[i]) - len(lines[i].lstrip())] + value
          builds = [i for i in range(end) if lines[i].strip() == "[build]"]
          if len(builds) != 1:
              sys.exit(f"expected exactly one prod [build] table, found {len(builds)}")
          start = builds[0]
          stop = next(i for i in range(start + 1, len(lines)) if header.match(lines[i]))
          del lines[start:stop]
          with open(dst, "w", encoding="utf-8") as f:
              f.write("\n".join(lines))
          print("wrangler.deploy.toml: 2 prod placeholders substituted, prod [build] removed")
          PY
      # The version serving 100% of traffic now, the rollback target. A
      # Worker that does not exist yet (first deploy) has none; any other
      # failure, or a split (gradual) deployment, stops the deploy.
      - id: prev
        name: Record the active Worker version
        if: steps.fresh.outputs.fresh == 'true'
        working-directory: workers/s3-bridge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/deployments-before.json"
          err="${RUNNER_TEMP}/deployments-before.err"
          if ./node_modules/.bin/wrangler deployments status --json -c wrangler.deploy.toml > "$out" 2> "$err"; then
            version=$(jq -r 'if (.versions | length) == 1 and .versions[0].percentage == 100 then .versions[0].version_id else empty end' "$out")
            if ! [[ "$version" =~ ^[0-9a-f-]{36}$ ]]; then
              echo "active deployment is not a single version at 100%; refusing to deploy"
              exit 1
            fi
            echo "active version before deploy: ${version}"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
          elif grep -q 'code: 10007' "$err"; then
            echo "first deploy: the Worker does not exist yet, so there is no rollback target"
          else
            cat "$err"
            exit 1
          fi
      - name: Apply D1 migrations (remote)
        if: steps.fresh.outputs.fresh == 'true'
        working-directory: workers/s3-bridge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ./node_modules/.bin/wrangler d1 migrations apply velmora-catalog --remote -c wrangler.deploy.toml
      - id: deploy
        name: Deploy the Worker
        if: steps.fresh.outputs.fresh == 'true'
        working-directory: workers/s3-bridge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Structured (ND-JSON) output, read below for the version id.
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: ./node_modules/.bin/wrangler deploy -c wrangler.deploy.toml
      # An unsigned GET must be refused with 403 and an S3 AccessDenied
      # body. Retries cover the propagation window right after deploy.
      - id: smoke
        name: Smoke test (unsigned GET is refused)
        if: steps.fresh.outputs.fresh == 'true'
        env:
          VELMORA_S3_HOST: ${{ vars.VELMORA_S3_HOST }}
        run: |
          set -euo pipefail
          body="${RUNNER_TEMP}/smoke-body"
          code=none
          for attempt in 1 2 3 4 5 6; do
            code=$(curl -sS -o "$body" -w '%{http_code}' --connect-timeout 10 --max-time 30 \
              "https://${VELMORA_S3_HOST}/" || true)
            echo "attempt ${attempt}: HTTP ${code}"
            if [ "$code" = "403" ] && grep -q '<Code>AccessDenied</Code>' "$body"; then
              exit 0
            fi
            sleep 10
          done
          echo "smoke: expected HTTP 403 AccessDenied for an unsigned GET, last got ${code}"
          exit 1
      # On any failure or cancellation after the rollback target was
      # recorded: roll back to that exact version, but only when the active
      # version is the one this run deployed (from the wrangler output), so
      # a deployment made outside this job is never replaced. Any other
      # state fails the step for a manual check.
      - name: Roll back to the recorded version
        if: ${{ (failure() || cancelled()) && steps.prev.outputs.version != '' }}
        working-directory: workers/s3-bridge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PREV_VERSION: ${{ steps.prev.outputs.version }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: |
          set -euo pipefail
          deployed=""
          if [ -f "$WRANGLER_OUTPUT_FILE_PATH" ]; then
            deployed=$(jq -r 'select(.type == "deploy") | .version_id // empty' "$WRANGLER_OUTPUT_FILE_PATH" | tail -n 1)
          fi
          out="${RUNNER_TEMP}/deployments-after.json"
          active=""
          for _ in 1 2 3; do
            if ./node_modules/.bin/wrangler deployments status --json -c wrangler.deploy.toml > "$out"; then
              active=$(jq -r 'if (.versions | length) == 1 and .versions[0].percentage == 100 then .versions[0].version_id else empty end' "$out")
              break
            fi
            sleep 5
          done
          if [ -n "$active" ] && [ "$active" = "$PREV_VERSION" ]; then
            echo "rollback: active version is still ${PREV_VERSION}; nothing to roll back"
            exit 0
          fi
          if [ -z "$deployed" ]; then
            echo "::error::rollback: this run has no deployed version id and the active version is '${active:-unknown}', not ${PREV_VERSION}; not rolling back, check manually"
            exit 1
          fi
          if [ -n "$active" ] && [ "$active" != "$deployed" ]; then
            echo "::error::rollback: active version ${active} is neither ${PREV_VERSION} nor this run's ${deployed}; not rolling back, check manually"
            exit 1
          fi
          # active is this run's version, or could not be read after a
          # deploy this run made: restore the recorded version.
          ./node_modules/.bin/wrangler rollback "$PREV_VERSION" -c wrangler.deploy.toml \
            --message "automatic rollback: deploy job failed or was cancelled" -y
          echo "Deploy failed or was cancelled; rolled back from \`${deployed}\` to Worker version \`${PREV_VERSION}\`." >> "$GITHUB_STEP_SUMMARY"
      - name: Record the Worker version id
        if: steps.fresh.outputs.fresh == 'true'
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
          PREV_VERSION: ${{ steps.prev.outputs.version }}
        run: |
          set -euo pipefail
          version_id=$(jq -r 'select(.type == "deploy") | .version_id // empty' "$WRANGLER_OUTPUT_FILE_PATH" 2>/dev/null | tail -n 1 || true)
          # The deploy already passed its smoke test; a missing id is a
          # reporting problem only and must not trigger a rollback.
          if [ -z "$version_id" ]; then
            echo "::warning::no version id in the wrangler output"
            version_id="unknown (see the deploy step log)"
          fi
          {
            echo "### Worker deployed"
            echo ""
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Worker version id: \`${version_id}\`"
            echo "- Previous version id: \`${PREV_VERSION:-none}\`"
          } >> "$GITHUB_STEP_SUMMARY"
