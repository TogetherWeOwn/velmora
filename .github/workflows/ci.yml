name: ci

# `ci-ok` is the aggregate check meant to be required on main: its NAME must
# stay `ci-ok`, and every gating job id must be listed in its `needs`.
# Patterns (pinned actions, cache policy, pinned cargo-deny, fail-closed
# aggregate) are copied from nntunev2's ci.yml at the extraction baseline.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Merge queue validation: every required check must report on the queue's
  # temporary merge commit. merge_group runs are never cancelled.
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # merge_group refs are per-queue-entry and must run to completion.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.event_name != 'merge_group' }}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  public-pr-security:
    if: github.event_name == 'pull_request' && github.event.repository.private == false
    # The nested OSV reusable requires this exact permission ceiling: actions
    # reads same-run comparison artifacts, contents reads the PR tree/history,
    # and security-events uploads comparison SARIF. No secrets are passed.
    permissions:
      actions: read # Nested OSV reads same-run comparison artifacts.
      contents: read
      security-events: write # Nested OSV uploads comparison SARIF.
    uses: TogetherWeOwn/.github/.github/workflows/public-pr-security.yml@feb1e0e2111da007f38ca75ee95c6f6944723d36 # v0.5.0

  rust-test:
    name: rust test (native)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --component rustfmt,clippy
          rustup default stable
      # rust-cache policy: PR and merge-queue runs restore main's cache but
      # only main saves, so per-PR copies do not evict main's entries.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # Reference PAR2 binary for the creator interop test
      # (`interop_repair_with_reference_binary_when_available`, which repairs
      # a creator-emitted set through the repair path and skips when no
      # binary is present). Distro par2cmdline proves spec-level interop of
      # the emitted bytes.
      - name: Install reference par2 binary for creator interop test
        run: sudo apt-get update && sudo apt-get install -y par2
      - run: cargo test --locked --workspace
      # Transport-free portable core on the same native runner: executes
      # velmora without default TLS features. This is native portable
      # behavior, not a wasm-runtime check (see rust-wasm).
      - run: cargo test --locked -p velmora --no-default-features
      - run: cargo clippy --locked -p velmora --no-default-features --features archive-provider --lib -- -D warnings
      - run: 'cargo test --locked -p velmora --no-default-features --features archive-provider --lib archive::'
      - run: cargo test --locked -p velmora --no-default-features --features archive-provider --test archive_provider
      # Exercise the preserved native TLS tests with the qualification feature
      # enabled as well. This does not execute the wasm-only Worker adapter.
      - run: cargo test --locked -p velmora --features worker-pinned-tls --lib

  rust-wasm:
    name: rust check (wasm32)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --component clippy --target wasm32-unknown-unknown
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Scalar core (no transport features) and the Workers transport build.
      - run: cargo check --locked -p velmora --target wasm32-unknown-unknown --no-default-features
      - run: cargo check --locked -p velmora --target wasm32-unknown-unknown --no-default-features --features worker-transport
      - run: cargo clippy --locked -p velmora --target wasm32-unknown-unknown --no-default-features --features worker-transport -- -D warnings
      # The simd128 yEnc fast path must keep compiling (Workers run V8 with
      # Wasm SIMD; consumers enable it via this RUSTFLAGS).
      - run: RUSTFLAGS="-C target-feature=+simd128" cargo check --locked -p velmora --target wasm32-unknown-unknown --no-default-features
      # S3 bridge core and protocol crates are runtime-agnostic and must
      # build for the Worker target without engine transport features.
      - run: cargo check --locked -p velmora-bridge -p velmora-s3-proto --target wasm32-unknown-unknown
      - run: cargo clippy --locked -p velmora-bridge -p velmora-s3-proto --target wasm32-unknown-unknown -- -D warnings

  # Clean, uncached compile of the preserved qualification-only Worker slice.
  # Compilation is not Worker entropy/clock, dialing or physical-close evidence.
  rust-worker-pinned-tls:
    name: rust check (Worker pinned TLS, compile only)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CC_wasm32_unknown_unknown: clang-18
      AR_wasm32_unknown_unknown: llvm-ar-18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The locked Worker SDK 0.8.7 requires Rust 1.91. Check its feature graph
      # at that minimum instead of raising the default/portable core MSRV.
      - name: Install Rust 1.91 (Worker SDK minimum)
        run: |
          rustup toolchain install 1.91 --profile minimal --no-self-update --component clippy --target wasm32-unknown-unknown
          rustup default 1.91
      - name: Install pinned Wasm C toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 llvm-18 lld-18
          clang-18 --version
          llvm-ar-18 --version
          wasm-ld-18 --version
      - run: cargo fetch --locked
      - run: cargo check --locked -p velmora-ssrf-guard --target wasm32-unknown-unknown
      # Check default native-tls alone before Worker features can mask missing
      # Wasm backend wiring through Cargo feature unification.
      - run: cargo check --locked -p velmora --target wasm32-unknown-unknown
      - run: cargo check --locked -p velmora --target wasm32-unknown-unknown --no-default-features --features worker-pinned-tls
      - run: cargo clippy --locked -p velmora --target wasm32-unknown-unknown --no-default-features --features worker-pinned-tls -- -D warnings
      # Retain compatibility when consumers leave native-tls enabled on wasm.
      - run: cargo check --locked -p velmora --target wasm32-unknown-unknown --all-features

  # MSRV gate: `rust-version` in crates/velmora/Cargo.toml must build the
  # locked dependency graph. Bump both together when the lockfile needs a
  # newer toolchain.
  rust-msrv:
    name: rust check (msrv)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.89 (velmora rust-version)
        run: |
          rustup toolchain install 1.89 --profile minimal --no-self-update
          rustup default 1.89
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --locked -p velmora
      - run: cargo check --locked -p velmora --no-default-features
      - run: cargo check --locked -p velmora-ssrf-guard
      # Bridge core and protocol crates declare the same 1.89 MSRV.
      - run: cargo check --locked -p velmora-s3-proto -p velmora-bridge
      - name: Install Rust 1.91 (Worker SDK minimum)
        run: |
          rustup toolchain install 1.91 --profile minimal --no-self-update
          rustup default 1.91
      - run: cargo check --locked -p velmora --features worker-pinned-tls
      # The S3 Worker crate declares rust-version 1.91 (workers-rs 0.8.7).
      - run: cargo check --locked -p velmora-s3-bridge

  # Dependency/security gate: the reviewed deny.toml policy must pass for
  # the committed lockfile. Findings are fixed by updating the dependency,
  # never by weakening the policy. Keep this job id in ci-ok's needs.
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - name: Install pinned cargo-deny 0.20.2
        run: |
          set -euo pipefail
          deny_version="0.20.2"
          asset="cargo-deny-${deny_version}-x86_64-unknown-linux-musl.tar.gz"
          base="https://github.com/EmbarkStudios/cargo-deny/releases/download/${deny_version}"
          # Pinned digest recorded in-repo so a replaced release artifact
          # fails closed instead of executing. Re-pin deliberately when the
          # version above changes, verifying the digest out-of-band first.
          expected_sha256="9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"
          curl -fsSL --connect-timeout 10 --max-time 30 --retry 3 \
            -o "/tmp/${asset}" "${base}/${asset}"
          echo "${expected_sha256}  /tmp/${asset}" | (cd /tmp && sha256sum -c -)
          mkdir -p "$HOME/.cargo/bin"
          tar -xzf "/tmp/${asset}" -C /tmp
          install -m 755 "/tmp/cargo-deny-${deny_version}-x86_64-unknown-linux-musl/cargo-deny" "$HOME/.cargo/bin/cargo-deny"
          cargo-deny --version
      # Fail-closed freshness: the committed lockfile must match the
      # manifests, or the audit below would check a stale dependency set.
      - name: Prove the committed lockfile is fresh
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Audit advisories, bans, licenses, sources
        run: cargo-deny --manifest-path Cargo.toml check

  # Path filter for the S3 bridge jobs below. Pull requests that touch only
  # files outside the Rust workspace (docs, READMEs, other workflows) skip
  # them; every other event runs them. Plain git, no third-party action. A
  # failure here fails ci-ok, so a broken filter can never skip a job.
  changes:
    name: changes (bridge paths)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      bridge: ${{ steps.filter.outputs.bridge }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR merge commit and its first parent (the base tip).
          fetch-depth: 2
          persist-credentials: false
      - id: filter
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$CI_EVENT_NAME" != "pull_request" ]; then
            echo "bridge=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only HEAD^1 HEAD)
          if grep -qE '^(Cargo\.toml|Cargo\.lock|deny\.toml|\.github/workflows/ci\.yml|crates/|workers/s3-bridge/)' <<< "$changed"; then
            echo "bridge=true" >> "$GITHUB_OUTPUT"
          else
            echo "bridge=false" >> "$GITHUB_OUTPUT"
          fi

  # S3 bridge core: contract tests (rusqlite Sql, in-memory blobs, fakes)
  # and, as lanes land, NntpClient against the in-process test server.
  bridge-native:
    name: bridge native tests
    needs: changes
    if: needs.changes.outputs.bridge == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --component clippy
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --locked -p velmora-s3-proto -p velmora-bridge
      - run: cargo clippy --locked -p velmora-s3-proto -p velmora-bridge --all-targets --features velmora-bridge/testkit -- -D warnings
      - run: cargo build --locked -p velmora-test-nntp --bin fakesrv

  # The S3 Worker bundle: wasm clippy with the request-target lint
  # (workers/s3-bridge/clippy.toml bans worker::Request::url), worker-build, size budget.
  worker-build:
    name: worker build (s3-bridge)
    needs: changes
    if: needs.changes.outputs.bridge == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --component clippy --target wasm32-unknown-unknown
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Matches the locked workers-rs 0.8.7 and wrangler.toml [build].
      - name: Install pinned worker-build 0.8.7
        run: cargo install --locked worker-build --version 0.8.7
      - run: cargo clippy --locked -p velmora-s3-bridge --target wasm32-unknown-unknown -- -D warnings
      - name: Build the Worker bundle
        working-directory: workers/s3-bridge
        run: worker-build --release
      - name: Size budget (index_bg.wasm under 3 MB)
        working-directory: workers/s3-bridge
        run: |
          set -euo pipefail
          size=$(stat -c %s build/index_bg.wasm)
          echo "index_bg.wasm: ${size} bytes (budget 3000000)"
          test "$size" -lt 3000000

  # Local end-to-end slice under `wrangler dev` with the fake NNTP server.
  # Passes with "skipped: no script" until workers/s3-bridge/e2e/slice.sh
  # exists. The script runs from workers/s3-bridge as
  # `bash e2e/slice.sh http://127.0.0.1:8787`; it starts fakesrv
  # ($FAKESRV_BIN), applies migrations --local (dev database
  # `velmora-catalog-dev`) and starts
  # `npx wrangler@4 dev --env dev --local --test-scheduled --port 8787`.
  worker-e2e:
    name: worker e2e (wrangler dev)
    needs: changes
    if: needs.changes.outputs.bridge == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: script
        run: |
          if [ -f workers/s3-bridge/e2e/slice.sh ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "skipped: no script"
          fi
      - name: Install Rust stable
        if: steps.script.outputs.present == 'true'
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --target wasm32-unknown-unknown
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.script.outputs.present == 'true'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install pinned worker-build 0.8.7
        if: steps.script.outputs.present == 'true'
        run: cargo install --locked worker-build --version 0.8.7
      - name: Install pinned aws-cli 2.31.23
        if: steps.script.outputs.present == 'true'
        run: |
          set -euo pipefail
          zip="awscli-exe-linux-x86_64-2.31.23.zip"
          # Digest of the release zip, recorded after verifying its PGP
          # signature against the AWS CLI Team key (fingerprint
          # FB5D B77F D5C1 18B8 0511 ADA8 A631 0ACC 4672 475C) out of band.
          # A replaced artifact fails closed here.
          expected_sha256="eca61882437a815d7a7df9e70982a71cdaef0c4061cf4fb63a07726bd6dfee08"
          curl -fsSL --connect-timeout 10 --max-time 120 --retry 3 -o "/tmp/${zip}" "https://awscli.amazonaws.com/${zip}"
          echo "${expected_sha256}  /tmp/${zip}" | (cd /tmp && sha256sum -c -)
          unzip -q "/tmp/${zip}" -d /tmp/awscli
          sudo /tmp/awscli/aws/install --update
          aws --version
      - name: Build fakesrv
        if: steps.script.outputs.present == 'true'
        run: cargo build --locked -p velmora-test-nntp --bin fakesrv
      - name: Run the local slice
        if: steps.script.outputs.present == 'true'
        working-directory: workers/s3-bridge
        env:
          FAKESRV_BIN: ${{ github.workspace }}/target/debug/fakesrv
          WRANGLER_SEND_METRICS: "false"
        run: bash e2e/slice.sh http://127.0.0.1:8787

  ci-ok:
    name: ci-ok
    needs: [rust-test, rust-wasm, rust-worker-pinned-tls, rust-msrv, cargo-deny, public-pr-security, changes, bridge-native, worker-build, worker-e2e]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          # Only the PR-only caller may skip, and only outside pull_request.
          # A private PR skips the caller but fails ci-ok without scanning.
          # The path-filtered bridge jobs must succeed when the filter says
          # bridge=true and must be skipped (not failed or cancelled) when it
          # says bridge=false; the filter job itself must succeed.
          if ! jq -e --arg event "$CI_EVENT_NAME" --arg bridge "$BRIDGE" '
            . as $n |
            ["bridge-native", "worker-build", "worker-e2e"] as $filtered |
            ($n | length) > 1 and
            $n["public-pr-security"].result == (if $event == "pull_request" then "success" else "skipped" end) and
            $n.changes.result == "success" and
            ($bridge == "true" or $bridge == "false") and
            all($filtered[]; $n[.].result == (if $bridge == "true" then "success" else "skipped" end)) and
            ($n | del(.["public-pr-security"]) | del(.[$filtered[]]) | all(.[]; .result == "success"))
          ' <<< "$NEEDS_JSON" > /dev/null; then
            echo "ci-ok: a required job did not succeed"
            exit 1
          fi
          echo "ci-ok: all required jobs passed"
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          CI_EVENT_NAME: ${{ github.event_name }}
          BRIDGE: ${{ needs.changes.outputs.bridge }}
