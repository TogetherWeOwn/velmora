name: ci

# `ci-ok` is the aggregate check meant to be required on main: its NAME must
# stay `ci-ok`, and every gating job id must be listed in its `needs`.
# Patterns (pinned actions, cache policy, pinned cargo-deny, fail-closed
# aggregate) are copied from nntunev2's ci.yml at the extraction baseline.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Merge queue validation: every required check must report on the queue's
  # temporary merge commit. merge_group runs are never cancelled.
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # merge_group refs are per-queue-entry and must run to completion.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.event_name != 'merge_group' }}

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  public-pr-security:
    if: github.event_name == 'pull_request' && github.event.repository.private == false
    # The nested OSV reusable requires this exact permission ceiling: actions
    # reads same-run comparison artifacts, contents reads the PR tree/history,
    # and security-events uploads comparison SARIF. No secrets are passed.
    permissions:
      actions: read # Nested OSV reads same-run comparison artifacts.
      contents: read
      security-events: write # Nested OSV uploads comparison SARIF.
    uses: TogetherWeOwn/.github/.github/workflows/public-pr-security.yml@c05610872587137c3c492b7025f02585a1b8ba7d # v0.11.0

  rust-test:
    name: rust test (native)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --component rustfmt,clippy
          rustup default stable
      # rust-cache policy: PR and merge-queue runs restore main's cache but
      # only main saves, so per-PR copies do not evict main's entries.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # `v1`: a new cache, begun when `cargo test` started to build the
          # dependencies optimized (`[profile.test.package."*"]` in the root
          # manifest). The cache key covers Cargo.lock and the manifests of
          # the members, not the root manifest, so the old cache matched in
          # full, was never saved again and kept the dependencies as they
          # were built before. Change the prefix again with that profile.
          prefix-key: v1-rust
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # Reference PAR2 binary for the creator interop test
      # (`interop_repair_with_reference_binary_when_available`, which repairs
      # a creator-emitted set through the repair path and skips when no
      # binary is present). Distro par2cmdline proves spec-level interop of
      # the emitted bytes.
      - name: Install reference par2 binary for creator interop test
        run: sudo apt-get update && sudo apt-get install -y par2
      - run: cargo test --locked --workspace
      # Transport-free portable core on the same native runner: executes
      # velmora without default TLS features. This is native portable
      # behavior, not a wasm-runtime check (see rust-wasm).
      - run: cargo test --locked -p velmora --no-default-features
      - run: cargo clippy --locked -p velmora --no-default-features --features archive-provider --lib -- -D warnings
      - run: 'cargo test --locked -p velmora --no-default-features --features archive-provider --lib archive::'
      - run: cargo test --locked -p velmora --no-default-features --features archive-provider --test archive_provider
      # Exercise the preserved native TLS tests with the qualification feature
      # enabled as well. This does not execute the wasm-only Worker adapter.
      - run: cargo test --locked -p velmora --features worker-pinned-tls --lib

  rust-wasm:
    name: rust check (wasm32)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --component clippy --target wasm32-unknown-unknown
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Scalar core (no transport features) and the Workers transport build.
      - run: cargo check --locked -p velmora --target wasm32-unknown-unknown --no-default-features
      - run: cargo check --locked -p velmora --target wasm32-unknown-unknown --no-default-features --features worker-transport
      - run: cargo clippy --locked -p velmora --target wasm32-unknown-unknown --no-default-features --features worker-transport -- -D warnings
      # The simd128 yEnc fast path must keep compiling (Workers run V8 with
      # Wasm SIMD; workers/s3-bridge/bundle.sh builds with this RUSTFLAGS).
      - run: RUSTFLAGS="-C target-feature=+simd128" cargo check --locked -p velmora --target wasm32-unknown-unknown --no-default-features
      # Repair-parity codec: the scalar and the simd128 wasm builds (release
      # profile, as the Worker is built) must both produce the bytes the
      # native build pins. run.mjs runs the module's self-check under V8
      # and fails on any difference, and on a build whose simd128 state is
      # not the one named. The simd128 build, the one a Worker would run,
      # also goes once through the timing entry points, so that those
      # exports are called as wasm and their results checked; the times
      # it prints are not a gate.
      - name: Parity codec self-check under wasm (scalar, then simd128)
        run: |
          set -euo pipefail
          wasm=target/wasm32-unknown-unknown/release/velmora_parity_bench.wasm
          cargo build --locked --release -p velmora-parity-bench --target wasm32-unknown-unknown
          node crates/velmora-parity-bench/run.mjs "$wasm" --expect-simd off --check-only
          RUSTFLAGS="-C target-feature=+simd128" cargo build --locked --release -p velmora-parity-bench --target wasm32-unknown-unknown
          node crates/velmora-parity-bench/run.mjs "$wasm" --expect-simd on --reps 1
      # The hot paths as the Worker bundle compiles them (wasm32, simd128,
      # release profile) must produce the bytes the native build pins:
      # run.mjs runs the self-check of velmora-cpu-bench under V8 and
      # fails on any difference. The timings it prints are not a gate.
      - name: Hot-path self-check under wasm (scalar, then simd128)
        run: |
          set -euo pipefail
          wasm=target/wasm32-unknown-unknown/release/velmora_cpu_bench.wasm
          cargo build --locked --release -p velmora-cpu-bench --target wasm32-unknown-unknown
          node crates/velmora-cpu-bench/run.mjs "$wasm" --expect-simd off --check-only
          RUSTFLAGS="-C target-feature=+simd128" cargo build --locked --release -p velmora-cpu-bench --target wasm32-unknown-unknown
          node crates/velmora-cpu-bench/run.mjs "$wasm" --expect-simd on --mib 2 --reps 1
      # S3 bridge core and protocol crates are runtime-agnostic and must
      # build for the Worker target without engine transport features.
      - run: cargo check --locked -p velmora-bridge -p velmora-s3-proto --target wasm32-unknown-unknown
      - run: cargo clippy --locked -p velmora-bridge -p velmora-s3-proto --target wasm32-unknown-unknown -- -D warnings

  # Clean, uncached compile of the preserved qualification-only Worker slice.
  # Compilation is not Worker entropy/clock, dialing or physical-close evidence.
  rust-worker-pinned-tls:
    name: rust check (Worker pinned TLS, compile only)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CC_wasm32_unknown_unknown: clang-18
      AR_wasm32_unknown_unknown: llvm-ar-18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The locked Worker SDK 0.8.7 requires Rust 1.91. Check its feature graph
      # at that minimum instead of raising the default/portable core MSRV.
      - name: Install Rust 1.91 (Worker SDK minimum)
        run: |
          rustup toolchain install 1.91 --profile minimal --no-self-update --component clippy --target wasm32-unknown-unknown
          rustup default 1.91
      - name: Install pinned Wasm C toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 llvm-18 lld-18
          clang-18 --version
          llvm-ar-18 --version
          wasm-ld-18 --version
      - run: cargo fetch --locked
      - run: cargo check --locked -p velmora-ssrf-guard --target wasm32-unknown-unknown
      # Check default native-tls alone before Worker features can mask missing
      # Wasm backend wiring through Cargo feature unification.
      - run: cargo check --locked -p velmora --target wasm32-unknown-unknown
      - run: cargo check --locked -p velmora --target wasm32-unknown-unknown --no-default-features --features worker-pinned-tls
      - run: cargo clippy --locked -p velmora --target wasm32-unknown-unknown --no-default-features --features worker-pinned-tls -- -D warnings
      # The proxied connector (SOCKS5, then TLS made in the Worker), alone.
      - run: cargo check --locked -p velmora --target wasm32-unknown-unknown --no-default-features --features worker-socks5-tls
      - run: cargo clippy --locked -p velmora --target wasm32-unknown-unknown --no-default-features --features worker-socks5-tls -- -D warnings
      # Retain compatibility when consumers leave native-tls enabled on wasm.
      - run: cargo check --locked -p velmora --target wasm32-unknown-unknown --all-features

  # MSRV gate: `rust-version` in crates/velmora/Cargo.toml must build the
  # locked dependency graph. Bump both together when the lockfile needs a
  # newer toolchain.
  rust-msrv:
    name: rust check (msrv)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust 1.89 (velmora rust-version)
        run: |
          rustup toolchain install 1.89 --profile minimal --no-self-update
          rustup default 1.89
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo check --locked -p velmora
      - run: cargo check --locked -p velmora --no-default-features
      - run: cargo check --locked -p velmora-ssrf-guard
      # Bridge core and protocol crates declare the same 1.89 MSRV.
      - run: cargo check --locked -p velmora-s3-proto -p velmora-bridge
      - run: cargo check --locked -p velmora-parity-bench
      - run: cargo check --locked -p velmora-cpu-bench
      - name: Install Rust 1.91 (Worker SDK minimum)
        run: |
          rustup toolchain install 1.91 --profile minimal --no-self-update
          rustup default 1.91
      - run: cargo check --locked -p velmora --features worker-pinned-tls
      - run: cargo check --locked -p velmora --features worker-socks5-tls
      # The S3 Worker crate declares rust-version 1.91 (workers-rs 0.8.7).
      - run: cargo check --locked -p velmora-s3-bridge

  # Dependency/security gate: the reviewed deny.toml policy must pass for
  # the committed lockfile. Findings are fixed by updating the dependency,
  # never by weakening the policy; the single reviewed exception path is
  # described in deny.toml's header. Keep this job id in ci-ok's needs.
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
      - name: Install pinned cargo-deny 0.20.2
        run: |
          set -euo pipefail
          deny_version="0.20.2"
          asset="cargo-deny-${deny_version}-x86_64-unknown-linux-musl.tar.gz"
          base="https://github.com/EmbarkStudios/cargo-deny/releases/download/${deny_version}"
          # Pinned digest recorded in-repo so a replaced release artifact
          # fails closed instead of executing. Re-pin deliberately when the
          # version above changes, verifying the digest out-of-band first.
          expected_sha256="9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f"
          curl -fsSL --connect-timeout 10 --max-time 30 --retry 3 \
            -o "/tmp/${asset}" "${base}/${asset}"
          echo "${expected_sha256}  /tmp/${asset}" | (cd /tmp && sha256sum -c -)
          mkdir -p "$HOME/.cargo/bin"
          tar -xzf "/tmp/${asset}" -C /tmp
          install -m 755 "/tmp/cargo-deny-${deny_version}-x86_64-unknown-linux-musl/cargo-deny" "$HOME/.cargo/bin/cargo-deny"
          cargo-deny --version
      # Fail-closed freshness: the committed lockfile must match the
      # manifests, or the audit below would check a stale dependency set.
      - name: Prove the committed lockfile is fresh
        run: cargo metadata --locked --format-version 1 > /dev/null
      - name: Audit advisories, bans, licenses, sources
        run: cargo-deny --manifest-path Cargo.toml check

  # Path filter for the S3 bridge jobs below. Pull requests that touch only
  # files outside the Rust workspace (docs, READMEs, other workflows) skip
  # them; every other event runs them. Plain git, no third-party action. A
  # failure here fails ci-ok, so a broken filter can never skip a job.
  changes:
    name: changes (bridge paths)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      bridge: ${{ steps.filter.outputs.bridge }}
      unit: ${{ steps.filter.outputs.unit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR merge commit and its first parent (the base tip).
          fetch-depth: 2
          persist-credentials: false
      - id: filter
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$CI_EVENT_NAME" != "pull_request" ]; then
            echo "bridge=true" >> "$GITHUB_OUTPUT"
            echo "unit=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only HEAD^1 HEAD)
          if grep -qE '^(Cargo\.toml|Cargo\.lock|deny\.toml|\.github/workflows/ci\.yml|crates/|workers/s3-bridge/)' <<< "$changed"; then
            echo "bridge=true" >> "$GITHUB_OUTPUT"
          else
            echo "bridge=false" >> "$GITHUB_OUTPUT"
          fi
          # The unit's code, the twin that compares it with SQLite, the
          # pinned workerd and the catalogue migrations a unit applies.
          if grep -qE '^(Cargo\.toml|Cargo\.lock|\.github/workflows/ci\.yml|workers/unit/|workers/unit-suite/|workers/s3-bridge/package-lock\.json|workers/s3-bridge/migrations/|crates/velmora-bridge/src/(unit|unit_lease)/|crates/velmora-bridge/src/(sql_bind|testkit|testkit_shadow)\.rs$|crates/velmora-bridge/tests/(unit_core|sql_binding|d1_binding)\.rs$)' <<< "$changed"; then
            echo "unit=true" >> "$GITHUB_OUTPUT"
          else
            echo "unit=false" >> "$GITHUB_OUTPUT"
          fi

  # S3 bridge core: contract tests (rusqlite Sql, in-memory blobs, fakes)
  # and, as lanes land, NntpClient against the in-process test server.
  bridge-native:
    name: bridge native tests
    needs: changes
    if: needs.changes.outputs.bridge == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --component clippy
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          # `v1`: a new cache, begun when `cargo test` started to build the
          # dependencies optimized (`[profile.test.package."*"]` in the root
          # manifest). The cache key covers Cargo.lock and the manifests of
          # the members, not the root manifest, so the old cache matched in
          # full, was never saved again and kept the dependencies as they
          # were built before. Change the prefix again with that profile.
          prefix-key: v1-rust
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --locked -p velmora-s3-proto -p velmora-bridge
      - run: cargo clippy --locked -p velmora-s3-proto -p velmora-bridge --all-targets --features velmora-bridge/testkit -- -D warnings
      - run: cargo build --locked -p velmora-test-nntp --bin fakesrv

  # The unit's core rules and the value binding on Durable Object SQLite
  # in workerd (workers/unit-suite/run-suite.sh): every call of these
  # test targets is also asked of a SQLite Durable Object and compared,
  # and the unit object smoke runs after them. About 2 minutes of tests.
  # The whole bridge suite on the twin (about 70 minutes) is not here:
  # it runs nightly on main (unit-suite.yml).
  unit-core:
    name: unit core (workerd)
    needs: changes
    if: needs.changes.outputs.unit == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --target wasm32-unknown-unknown
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install pinned worker-build 0.8.7
        run: cargo install --locked worker-build --version 0.8.7
      # The pinned workerd comes from the deploy tooling's lockfile.
      - name: Install the pinned deploy tooling
        working-directory: workers/s3-bridge
        run: npm ci --silent
      - name: Unit core, binding and object smoke (workerd twin)
        env:
          SUITE_INSTANCES: "2"
        run: bash workers/unit-suite/run-suite.sh --test unit_core --test sql_binding --test d1_binding

  # The S3 Worker bundle: wasm clippy with the request-target lint
  # (workers/s3-bridge/clippy.toml bans worker::Request::url), worker-build,
  # Cloudflare's size limit, and a size report against main.
  worker-build:
    name: worker build (s3-bridge)
    needs: changes
    if: needs.changes.outputs.bridge == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read # The size report reads main's last measurement (an artifact).
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR merge commit and its first parent (the base tip), for
          # the size report.
          fetch-depth: 2
          persist-credentials: false
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --component clippy --target wasm32-unknown-unknown
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # Matches the locked workers-rs 0.8.7 and wrangler.toml [build].
      - name: Install pinned worker-build 0.8.7
        run: cargo install --locked worker-build --version 0.8.7
      - run: cargo clippy --locked -p velmora-s3-bridge --target wasm32-unknown-unknown -- -D warnings
      - name: Test the wasm section stripper
        working-directory: workers/s3-bridge
        run: python3 -I tools/test_strip_wasm.py
      - name: Test the entry module (entry.mjs)
        working-directory: workers/s3-bridge
        run: node --test test/*.test.mjs
      - name: Test the registry path remap of bundle.sh
        working-directory: workers/s3-bridge
        run: python3 -I tools/test_registry_src_dirs.py
      - name: Test the bundle size check and report
        working-directory: workers/s3-bridge
        run: python3 -I tools/test_bundle_size.py
      # The script of the deploy job's "Generate the production wrangler
      # config" step, taken from this file and run on the shipped
      # wrangler.toml with made-up values. No credential, no network.
      - name: Test the production config generator
        working-directory: workers/s3-bridge
        run: python3 -I tools/test_deploy_config.py
      - name: Test the deploy switches and rollback
        working-directory: workers/s3-bridge
        run: python3 -I tools/test_deploy_switches.py
      - name: Test the migration file check
        working-directory: workers/s3-bridge
        run: python3 -I tools/test_migrations_check.py
      # bundle.sh: worker-build, then the `name` section is dropped. The
      # same script builds the deploy artifact and the wrangler dev bundle.
      - name: Build the Worker bundle
        working-directory: workers/s3-bridge
        run: bash bundle.sh
      - name: Bundle contents (stripped, no registry path)
        working-directory: workers/s3-bridge
        run: |
          set -euo pipefail
          python3 -I tools/strip_wasm.py check build/index_bg.wasm
          # The strip found a `name` section and kept the copy that
          # deploy-build uploads; fails here, not after the merge.
          test -s symbols/index_bg.unstripped.wasm
          # bundle.sh remapped the registry source paths of panic
          # locations to `crates.io/..`; none is left.
          if grep -a -q '/registry/src/' build/index_bg.wasm; then
            echo "index_bg.wasm still names a registry source path"
            exit 1
          fi
      - name: Install pinned wrangler (npm ci)
        working-directory: workers/s3-bridge
        run: npm ci --ignore-scripts --no-audit --no-fund
      # The only blocking size check is Cloudflare's own limit: 64 MiB
      # uncompressed on every plan, no compressed limit
      # (developers.cloudflare.com/workers/platform/limits/#worker-size),
      # on what `wrangler deploy --dry-run` would upload (its "Total
      # Upload"). The other limit, 1 s of start-up, has no CI measurement:
      # the dry run reports none. Cloudflare measures it on each upload and
      # refuses a deploy over it (error 10021); it reported 3 to 6 ms for
      # every bundle from 2.8 to 16.0 MB (2026-11-21).
      - name: Worker size limit (64 MiB uncompressed upload)
        working-directory: workers/s3-bridge
        run: bash tools/size_check.sh "$RUNNER_TEMP/size.json"
      # Not blocking: the size, its change against main, and a warning
      # when it grew by more than 1 % or 50,000 bytes, with its measured
      # cost (about 10.5 ms per MB on a request served by a new isolate).
      # main's measurement is the artifact of main's run for the base
      # commit, else the newest one from main.
      - name: Fetch main's size measurement (not blocking)
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        # Only gh, jq and unzip see the token; no script of the repo runs here.
        run: |
          set -euo pipefail
          base="$RUNNER_TEMP/base.json"
          parent=$(git rev-parse HEAD^1)
          id=$(gh api -X GET "repos/${GITHUB_REPOSITORY}/actions/artifacts" \
                 -f name=s3-bridge-size -f per_page=100 \
               | jq -r --arg p "$parent" '
                   [.artifacts[]
                    | select(.expired | not)
                    | select(.workflow_run.head_branch == "main")
                    | select(.workflow_run.head_repository_id == .workflow_run.repository_id)]
                   | sort_by(.created_at) | reverse
                   | ([.[] | select(.workflow_run.head_sha == $p)] + .)
                   | .[0].id // empty') || id=""
          if [ -n "$id" ] \
             && gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}/zip" > "$RUNNER_TEMP/base.zip" \
             && unzip -p "$RUNNER_TEMP/base.zip" size.json > "$base"; then
            :
          else
            [ ! -e "$base" ] || rm -- "$base"
            echo "No size measurement from main could be read; reporting without a delta."
          fi
      # Without a token. A failed fetch above still leaves a report.
      - name: Size report against main (not blocking)
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        continue-on-error: true
        working-directory: workers/s3-bridge
        run: |
          set -euo pipefail
          python3 -I tools/bundle_size.py report "$RUNNER_TEMP/size.json" "$RUNNER_TEMP/base.json" "$(git rev-parse HEAD^1)"
      # main's measurement, for the reports of later PRs. Never blocks the
      # release: without it a later report has no delta or an older one.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          name: s3-bridge-size
          path: ${{ runner.temp }}/size.json
          if-no-files-found: error
          retention-days: 90

  # Local end-to-end slice under `wrangler dev` with the fake NNTP server.
  # Passes with "skipped: no script" until workers/s3-bridge/e2e/slice.sh
  # exists. The script runs from workers/s3-bridge as
  # `bash e2e/slice.sh http://127.0.0.1:8787`; it starts fakesrv
  # ($FAKESRV_BIN), applies migrations --local (dev database
  # `velmora-catalog-dev`) and starts
  # `npx wrangler@4 dev --env dev --local --test-scheduled --port 8787`.
  # It runs twice with aws-cli's default checksum settings: over HTTP (a
  # CRC64NVME header) and over local HTTPS (aws-chunked bodies with a
  # trailing checksum). Each run also covers `when_required` (step 0b).
  worker-e2e:
    name: worker e2e (wrangler dev)
    needs: changes
    if: needs.changes.outputs.bridge == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: script
        run: |
          if [ -f workers/s3-bridge/e2e/slice.sh ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "skipped: no script"
          fi
      - name: Install Rust stable
        if: steps.script.outputs.present == 'true'
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --target wasm32-unknown-unknown
          rustup default stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.script.outputs.present == 'true'
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install pinned worker-build 0.8.7
        if: steps.script.outputs.present == 'true'
        run: cargo install --locked worker-build --version 0.8.7
      - name: Install pinned aws-cli 2.31.23
        if: steps.script.outputs.present == 'true'
        run: |
          set -euo pipefail
          zip="awscli-exe-linux-x86_64-2.31.23.zip"
          # Digest of the release zip, recorded after verifying its PGP
          # signature against the AWS CLI Team key (fingerprint
          # FB5D B77F D5C1 18B8 0511 ADA8 A631 0ACC 4672 475C) out of band.
          # A replaced artifact fails closed here.
          expected_sha256="eca61882437a815d7a7df9e70982a71cdaef0c4061cf4fb63a07726bd6dfee08"
          curl -fsSL --connect-timeout 10 --max-time 120 --retry 3 -o "/tmp/${zip}" "https://awscli.amazonaws.com/${zip}"
          echo "${expected_sha256}  /tmp/${zip}" | (cd /tmp && sha256sum -c -)
          unzip -q "/tmp/${zip}" -d /tmp/awscli
          sudo /tmp/awscli/aws/install --update
          aws --version
      - name: Build fakesrv
        if: steps.script.outputs.present == 'true'
        run: cargo build --locked -p velmora-test-nntp --bin fakesrv
      - name: Run the local slice (HTTP)
        if: steps.script.outputs.present == 'true'
        working-directory: workers/s3-bridge
        env:
          FAKESRV_BIN: ${{ github.workspace }}/target/debug/fakesrv
          WRANGLER_SEND_METRICS: "false"
        run: bash e2e/slice.sh http://127.0.0.1:8787
      - name: Run the local slice (HTTPS, aws-chunked)
        if: steps.script.outputs.present == 'true'
        working-directory: workers/s3-bridge
        env:
          FAKESRV_BIN: ${{ github.workspace }}/target/debug/fakesrv
          WRANGLER_SEND_METRICS: "false"
          # This run takes provider permits from the gate object; the
          # HTTP run above takes them from the catalogue's slot rows.
          E2E_PERMITS: "do"
          # And its writers send job messages that name their tenant
          # (format 2), through the real queue binding; the HTTP run
          # above sends format 1.
          E2E_JOB_FORMAT: "2"
        run: bash e2e/slice.sh https://127.0.0.1:8787

  # The console Worker (apps/console): plain JavaScript, no dependencies,
  # tested with the Node test runner. Cheap, so it runs on every event.
  console-test:
    name: console tests (node)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node version
        run: node --version
      - name: Unit tests
        working-directory: apps/console
        run: node --test test/*.test.js

  # The alerts Worker (workers/alerts): plain JavaScript, no dependencies,
  # tested with the Node test runner over node:sqlite (Node 22.13 or later).
  alerts-test:
    name: alerts worker tests (node)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node version
        run: node --version
      - name: Unit tests
        working-directory: workers/alerts
        run: node --test test/*.test.js

  migrations-check:
    name: migrations-check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check migration files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          VELMORA_CATALOGUE_MIGRATIONS: ${{ vars.VELMORA_CATALOGUE_MIGRATIONS }}
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          import os, re, subprocess, sys

          base = os.environ.get("BASE_SHA", "")
          if not base or set(base) == {"0"}:
              print("migration check skipped: this event has no base commit")
              sys.exit(0)
          head = os.environ["HEAD_SHA"]

          def git(*args):
              return subprocess.check_output(["git", *args])

          if os.environ["GITHUB_EVENT_NAME"] in ("pull_request", "merge_group"):
              base = git("merge-base", base, head).decode("ascii").strip()

          destructive = re.compile(
              r"\bDROP\s+(?:TABLE|COLUMN|INDEX|TRIGGER|VIEW)\b|\bDELETE\s+FROM\b|"
              r"\bALTER\s+TABLE\b[^;]*\b(?:DROP|RENAME)\b",
              re.IGNORECASE,
          )
          filename = re.compile(r"([0-9]{4})_[a-z][a-z0-9]*(?:_[a-z0-9]+)*\.sql")
          checked = 0
          errors = []
          # Only the deployed migration folders are checked. migrations-next/ is excluded.
          for folder in ("workers/s3-bridge/migrations/", "workers/s3-bridge/migrations-directory/"):
              # With rename detection off, a move out of a folder is a removal.
              diff = git("diff", "--no-renames", "--name-status", "-z", base, head, "--", folder)
              changes = diff.decode("utf-8", "surrogateescape").split("\0")
              existing = git("ls-tree", "-r", "--name-only", "-z", base, "--", folder)
              numbers = re.findall(rb"(?:^|/)([0-9]+)_[^/\x00]+\.sql\x00", existing)
              highest = max(map(int, numbers), default=-1)
              new_numbers = set()
              for status, path in zip(changes[::2], changes[1::2]):
                  name = path.removeprefix(folder)
                  # The deploy job also checks the database for pending migrations.
                  if (status == "A" and folder.endswith("/migrations/")
                          and os.environ.get("VELMORA_CATALOGUE_MIGRATIONS") == "off"):
                      errors.append("no new catalogue migration while VELMORA_CATALOGUE_MIGRATIONS is off")
                      if not name.endswith(".sql"):
                          print(f"checking migration file {path!r}")
                          checked += 1
                  if not name.endswith(".sql"):
                      continue
                  print(f"checking migration file {path!r}")
                  checked += 1
                  if status != "A":
                      errors.append(f"migration {name} was changed or removed; migrations are append-only")
                      continue
                  match = filename.fullmatch(name)
                  number = int(match[1]) if match else -1
                  if not match or number <= highest or number in new_numbers:
                      errors.append(f"migration {name} must use a unique NNNN_<snake>.sql number greater than {highest}")
                  new_numbers.add(number)
                  sql = git("show", f"{head}:{path}").decode("utf-8")
                  first = sql.partition("\n")[0].removesuffix("\r")
                  stripped = re.sub(r"--[^\r\n]*|/\*[\s\S]*?\*/", " ", sql)
                  if ((destructive.search(stripped) or destructive.search(sql))
                          and not re.fullmatch(r"-- contract: \S.*", first)):
                      errors.append(f"migration {name} contains destructive SQL without a first-line contract reason")

          print(f"migration check: {checked} file(s) checked, {len(errors)} error(s)")
          if errors:
              sys.exit("\n".join(errors))
          PY

  ci-ok:
    name: ci-ok
    needs: [rust-test, rust-wasm, rust-worker-pinned-tls, rust-msrv, cargo-deny, public-pr-security, changes, bridge-native, worker-build, worker-e2e, unit-core, console-test, alerts-test, migrations-check]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          # Only the PR-only caller may skip, and only outside pull_request.
          # A private PR skips the caller but fails ci-ok without scanning.
          # The path-filtered bridge jobs must succeed when the filter says
          # bridge=true and must be skipped (not failed or cancelled) when it
          # says bridge=false; the filter job itself must succeed. The unit
          # job follows its own filter (unit) the same way.
          if ! jq -e --arg event "$CI_EVENT_NAME" --arg bridge "$BRIDGE" --arg unit "$UNIT" '
            . as $n |
            ["bridge-native", "worker-build", "worker-e2e"] as $filtered |
            ($n | length) > 1 and
            $n["public-pr-security"].result == (if $event == "pull_request" then "success" else "skipped" end) and
            $n.changes.result == "success" and
            ($bridge == "true" or $bridge == "false") and
            ($unit == "true" or $unit == "false") and
            all($filtered[]; $n[.].result == (if $bridge == "true" then "success" else "skipped" end)) and
            $n["unit-core"].result == (if $unit == "true" then "success" else "skipped" end) and
            ($n | del(.["public-pr-security"]) | del(.[$filtered[]]) | del(.["unit-core"]) | all(.[]; .result == "success"))
          ' <<< "$NEEDS_JSON" > /dev/null; then
            echo "ci-ok: a required job did not succeed"
            exit 1
          fi
          echo "ci-ok: all required jobs passed"
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          CI_EVENT_NAME: ${{ github.event_name }}
          BRIDGE: ${{ needs.changes.outputs.bridge }}
          UNIT: ${{ needs.changes.outputs.unit }}

  # Production deploy of the S3 Worker after ci-ok on a push to main, in two
  # jobs. They depend on ci-ok, never the reverse, and are not part of
  # ci-ok. `!cancelled()` is needed because the PR-only public-pr-security
  # job is a skipped ancestor, which would make the implicit success()
  # skip these jobs.
  #
  # deploy-build compiles the Worker with no environment and no secrets,
  # and hands the bundle to deploy as an artifact. deploy runs in the
  # protected `production` environment (main only) and executes no cargo,
  # build.rs or worker-build code. Wrangler comes from the committed
  # workers/s3-bridge/package-lock.json, installed with `npm ci
  # --ignore-scripts` before any credential is in env. The Cloudflare token
  # and account id reach only the wrangler steps that call the API, through
  # env, never argv. Worker secrets are never read, written or listed.
  #
  # D1 migrations must be additive-only (expand, then contract in a later
  # release): they run before the new version goes live, and a rollback
  # restores the previous Worker version but never reverts a migration.
  deploy-build:
    name: deploy build (s3-bridge bundle)
    needs: [ci-ok, changes]
    if: ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.bridge == 'true' && needs.changes.result == 'success' && needs.ci-ok.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      fresh: ${{ steps.fresh.outputs.fresh }}
    steps:
      # Build only for the tip of main or the frozen commit.
      - id: fresh
        name: Check that this commit is still the tip of main
        env:
          VELMORA_DEPLOY_FREEZE: ${{ vars.VELMORA_DEPLOY_FREEZE }}
        run: |
          set -euo pipefail
          tip=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}" refs/heads/main | cut -f1)
          if [ "$tip" = "$GITHUB_SHA" ]; then
            echo "deploy: ${GITHUB_SHA} is the tip of main"
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          elif [ "${VELMORA_DEPLOY_FREEZE:-}" = "$GITHUB_SHA" ]; then
            echo "deploy: ${GITHUB_SHA} is the frozen commit; it builds although main is at ${tip}"
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          elif [ -n "${VELMORA_DEPLOY_FREEZE:-}" ]; then
            echo "::error::main moved from ${GITHUB_SHA} to ${tip}; the deploy freeze is set to another commit"
            exit 1
          else
            echo "skipped: main moved from ${GITHUB_SHA} to ${tip}; the newer run deploys"
            echo "fresh=false" >> "$GITHUB_OUTPUT"
            echo "Deploy skipped: main moved to \`${tip}\`; the newer run deploys." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.fresh.outputs.fresh == 'true'
        with:
          persist-credentials: false
      # No build cache: a deploy never restores a cache another run wrote.
      - name: Install Rust stable
        if: steps.fresh.outputs.fresh == 'true'
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --target wasm32-unknown-unknown
          rustup default stable
      # Matches the locked workers-rs 0.8.7 and wrangler.toml [build].
      - name: Install pinned worker-build 0.8.7
        if: steps.fresh.outputs.fresh == 'true'
        run: cargo install --locked worker-build --version 0.8.7
      # The same build as the worker-build job (bundle.sh), and the same
      # size check (Cloudflare's 64 MiB limit), here on the bundle that ships.
      - name: Build the Worker bundle
        if: steps.fresh.outputs.fresh == 'true'
        working-directory: workers/s3-bridge
        run: |
          set -euo pipefail
          bash bundle.sh
          python3 -I tools/strip_wasm.py check build/index_bg.wasm
      - name: Install pinned wrangler (npm ci)
        if: steps.fresh.outputs.fresh == 'true'
        working-directory: workers/s3-bridge
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Worker size limit (64 MiB uncompressed upload)
        if: steps.fresh.outputs.fresh == 'true'
        working-directory: workers/s3-bridge
        run: bash tools/size_check.sh "$RUNNER_TEMP/size.json"
      - name: Write the floor level beside the bundle
        if: steps.fresh.outputs.fresh == 'true'
        working-directory: workers/s3-bridge
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          from pathlib import Path
          import re, sys

          source = Path("src/lib.rs").read_text(encoding="utf-8")
          levels = re.findall(r"^pub const FLOOR_LEVEL: u32 = ([0-9]+);$", source, re.MULTILINE)
          if len(levels) != 1:
              sys.exit("expected exactly one FLOOR_LEVEL constant in src/lib.rs")
          level = levels[0]
          Path("build/floor-level").write_text(level + "\n", encoding="utf-8")
          print(f"floor level: {level}")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.fresh.outputs.fresh == 'true'
        with:
          name: s3-bridge-bundle
          path: workers/s3-bridge/build/
          if-no-files-found: error
          retention-days: 30
      # The unstripped wasm of this release: it names the functions in a
      # production trace frame `wasm-function[N]:0xOFF` (same indices and
      # code offsets). Not deployed. See workers/s3-bridge/ops/README.md,
      # "Naming a wasm frame".
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.fresh.outputs.fresh == 'true'
        with:
          name: s3-bridge-symbols
          path: workers/s3-bridge/symbols/index_bg.unstripped.wasm
          if-no-files-found: error
          retention-days: 90

  deploy:
    name: deploy (production)
    needs: [deploy-build]
    if: ${{ !cancelled() && needs.deploy-build.result == 'success' && needs.deploy-build.outputs.fresh == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production
    permissions:
      contents: read
    outputs:
      rollback: ${{ steps.rollback.outputs.rollback }}
      refused: ${{ steps.fresh.outputs.refused || steps.switches.outputs.refused }}
    # One production deploy at a time; a running deploy is never cancelled.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      WRANGLER_SEND_METRICS: "false"
    steps:
      # Re-check after the build and the concurrency wait.
      - id: fresh
        name: Check that this commit is still the tip of main
        env:
          VELMORA_DEPLOY_FREEZE: ${{ vars.VELMORA_DEPLOY_FREEZE }}
        run: |
          set -euo pipefail
          tip=$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}" refs/heads/main | cut -f1)
          if [ "$tip" = "$GITHUB_SHA" ]; then
            echo "deploy: ${GITHUB_SHA} is the tip of main"
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          elif [ "${VELMORA_DEPLOY_FREEZE:-}" = "$GITHUB_SHA" ]; then
            echo "deploy: ${GITHUB_SHA} is the frozen commit; it deploys although main is at ${tip}"
            echo "fresh=true" >> "$GITHUB_OUTPUT"
          elif [ -n "${VELMORA_DEPLOY_FREEZE:-}" ]; then
            echo "::error::main moved from ${GITHUB_SHA} to ${tip}; the deploy freeze is set to another commit"
            echo "refused=freeze" >> "$GITHUB_OUTPUT"
            exit 1
          else
            echo "skipped: main moved from ${GITHUB_SHA} to ${tip}; the newer run deploys"
            echo "fresh=false" >> "$GITHUB_OUTPUT"
            echo "Deploy skipped: main moved to \`${tip}\`; the newer run deploys." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.fresh.outputs.fresh == 'true'
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.fresh.outputs.fresh == 'true'
        with:
          name: s3-bridge-bundle
          path: workers/s3-bridge/build
      - name: Check the deploy switches
        if: steps.fresh.outputs.fresh == 'true'
        id: switches
        env:
          VELMORA_DEPLOY_FREEZE: ${{ vars.VELMORA_DEPLOY_FREEZE }}
          VELMORA_FLOOR_MIN: ${{ vars.VELMORA_FLOOR_MIN }}
          VELMORA_FLOOR_VERSION: ${{ vars.VELMORA_FLOOR_VERSION }}
          VELMORA_CATALOGUE_MIGRATIONS: ${{ vars.VELMORA_CATALOGUE_MIGRATIONS }}
          FLOOR_LEVEL_FILE: workers/s3-bridge/build/floor-level
        run: |
          set -euo pipefail
          python3 -I - <<'PY'
          from pathlib import Path
          import os, re, sys

          def refuse(message):
              with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                  output.write("refused=switches\n")
              sys.exit(message)

          freeze = os.environ.get("VELMORA_DEPLOY_FREEZE", "")
          if freeze:
              if not re.fullmatch(r"[0-9a-f]{40}", freeze):
                  refuse("VELMORA_DEPLOY_FREEZE must be unset or a full 40-hex commit id")
              sha = os.environ["GITHUB_SHA"]
              if freeze != sha:
                  refuse(f"::error::deploy frozen: only commit {freeze} may deploy; this run is {sha}")
              print("deploy freeze: on, this commit is the one allowed")
          else:
              print("deploy freeze: off")

          try:
              level = Path(os.environ["FLOOR_LEVEL_FILE"]).read_bytes()
          except OSError:
              level = b""
          if not re.fullmatch(rb"[0-9]+\n?", level):
              refuse("the bundle has no valid floor level")
          minimum = os.environ.get("VELMORA_FLOOR_MIN", "") or "0"
          if not re.fullmatch(r"[0-9]+", minimum):
              refuse("VELMORA_FLOOR_MIN must be unset or a whole number")
          # Compare decimal digits without an integer conversion size limit.
          level = level.decode("ascii").rstrip("\n").lstrip("0") or "0"
          minimum = minimum.lstrip("0") or "0"
          if (len(level), level) < (len(minimum), minimum):
              refuse(f"::error::bundle floor level {level} is below VELMORA_FLOOR_MIN {minimum}; refusing to deploy")
          print(f"floor level of this bundle: {level}; required minimum: {minimum}")

          version = os.environ.get("VELMORA_FLOOR_VERSION", "")
          uuid = r"[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}"
          if version and not re.fullmatch(uuid, version):
              refuse("VELMORA_FLOOR_VERSION must be unset or a lowercase version id (UUID)")
          print(f"rollback floor version: {version or 'unset'}")

          migrations = os.environ.get("VELMORA_CATALOGUE_MIGRATIONS", "") or "on"
          if migrations not in ("on", "off"):
              sys.exit("VELMORA_CATALOGUE_MIGRATIONS must be unset, on or off")
          print(f"catalogue migrations: {migrations}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"migrations={migrations}\nfloor_version={version}\n")
          PY
      # Pinned wrangler from the committed lockfile; no install scripts run,
      # and no credentials are in env.
      - name: Install pinned wrangler (npm ci)
        if: steps.fresh.outputs.fresh == 'true'
        working-directory: workers/s3-bridge
        run: npm ci --ignore-scripts --no-audit --no-fund
      # Writes wrangler.deploy.toml: fills the prod S3_HOST and the prod
      # (first) database_id placeholder, each of which must appear exactly
      # once before the first [env.*] table, and drops the prod [build]
      # table so wrangler uploads the downloaded bundle and runs no
      # repository build code. Values must be a valid hostname and a UUID,
      # so nothing else can be injected into the TOML. Values are never
      # printed. Pure Python, no repository code.
      # The recovery copy is switched by two more variables of the
      # environment: VELMORA_RECOVERY_COPY (unset or "off": the shipped
      # "off" stays; "on") and VELMORA_RECOVERY_PREFIX. "on" needs a valid
      # prefix (lowercase segments, each ending with "/"); with a missing
      # or invalid one this step fails and nothing is deployed. A prefix
      # that is set must be valid also while the copy is off. The shipped
      # file must say "off" exactly once, in the prod [vars] table, and
      # name no prefix, whatever the switch says. The store's endpoint,
      # region, bucket and keys are Worker secrets: this job writes none
      # of them, and a plain var set outside it is gone after a deploy.
      # The verify stage is switched the same way: VELMORA_VERIFY_MODE
      # (unset, empty or "body": the shipped "body" stays; "light"). Any
      # other value fails this step and nothing is deployed. The shipped
      # file must say "body" exactly once, in the prod [vars] table, and
      # set VERIFY_MODE nowhere else in the prod section.
      # The layout of new recovery records is the third switch:
      # VELMORA_RECORD_LAYOUT (unset, empty or "flat": nothing is added
      # and the file is the one this step wrote before the switch, byte
      # for byte; "tenant": one line, RECORD_LAYOUT = "tenant", is added
      # to the prod [vars] table, after the VERIFY_MODE line). Any other
      # value fails this step and nothing is deployed. The shipped file
      # must not set RECORD_LAYOUT in the prod section: with one there
      # this step fails, whatever the switch says. Before the file is
      # written its text is read back with Python's TOML 1.0 parser:
      # the prod [vars] table must hold RECORD_LAYOUT = "tenant" when
      # "tenant" was asked for and no RECORD_LAYOUT otherwise, or this
      # step fails and writes no file. That parser is stricter than
      # wrangler's: a shipped file it cannot read is refused here, also
      # with the switch unset. The log then names the layout the
      # generated config carries. It is the layout in force only once
      # the deploy step of the same run has succeeded, and only while
      # the Worker has no secret named RECORD_LAYOUT: the Worker reads
      # a secret where the variable is absent, and a deploy keeps
      # secrets. This job cannot see secrets; no such secret may exist.
      # Set "tenant" only in a deploy after the one that brought this
      # switch, and read "Record layout" and "Rollback floor" in
      # workers/s3-bridge/ops/README.md first. The test of this step is
      # workers/s3-bridge/tools/test_deploy_config.py: it runs the
      # script below as it stands in this file, and it holds that the
      # step is that script and nothing else.
      #
      # VELMORA_S3_HOSTS adds S3 endpoint hosts as comma separated
      # hostname=class entries. Attach each host as a Custom Domain
      # before setting the variable. The smoke test checks every host.
      - name: Generate the production wrangler config
        if: steps.fresh.outputs.fresh == 'true'
        working-directory: workers/s3-bridge
        env:
          VELMORA_S3_HOST: ${{ vars.VELMORA_S3_HOST }}
          VELMORA_S3_HOSTS: ${{ vars.VELMORA_S3_HOSTS }}
          VELMORA_D1_DATABASE_ID: ${{ vars.VELMORA_D1_DATABASE_ID }}
          VELMORA_RECOVERY_COPY: ${{ vars.VELMORA_RECOVERY_COPY }}
          VELMORA_RECOVERY_PREFIX: ${{ vars.VELMORA_RECOVERY_PREFIX }}
          VELMORA_VERIFY_MODE: ${{ vars.VELMORA_VERIFY_MODE }}
          VELMORA_RECORD_LAYOUT: ${{ vars.VELMORA_RECORD_LAYOUT }}
          VELMORA_MAINTENANCE: ${{ vars.VELMORA_MAINTENANCE }}
          VELMORA_CATALOGUE_ID: ${{ vars.VELMORA_CATALOGUE_ID }}
          VELMORA_JOB_FORMAT: ${{ vars.VELMORA_JOB_FORMAT }}
          VELMORA_DIRECTORY_D1_ID: ${{ vars.VELMORA_DIRECTORY_D1_ID }}
          VELMORA_KEYS_A_BUCKET: ${{ vars.VELMORA_KEYS_A_BUCKET }}
          VELMORA_KEYS_B_BUCKET: ${{ vars.VELMORA_KEYS_B_BUCKET }}
        run: |
          set -euo pipefail
          python3 -I - wrangler.toml wrangler.deploy.toml <<'PY'
          import os, re, sys, tomllib

          src, dst = sys.argv[1], sys.argv[2]
          host = os.environ.get("VELMORA_S3_HOST", "")
          hosts = os.environ.get("VELMORA_S3_HOSTS", "")
          dbid = os.environ.get("VELMORA_D1_DATABASE_ID", "")
          label = r"[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?"
          hostname = re.compile(rf"{label}(\.{label})+")
          if len(host) > 253 or not hostname.fullmatch(host):
              sys.exit("VELMORA_S3_HOST is missing or not a plain lowercase hostname")
          uuid = r"[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}"
          if not re.fullmatch(uuid, dbid):
              sys.exit("VELMORA_D1_DATABASE_ID is missing or not a lowercase UUID")
          copy = os.environ.get("VELMORA_RECOVERY_COPY", "") or "off"
          prefix = os.environ.get("VELMORA_RECOVERY_PREFIX", "")
          if copy not in ("off", "on"):
              sys.exit("VELMORA_RECOVERY_COPY must be unset, off or on")
          segment = r"[a-z0-9]([a-z0-9_-]{0,30}[a-z0-9])?"
          prefix_ok = len(prefix) <= 64 and re.fullmatch(rf"({segment}/)+", prefix) is not None
          if prefix and not prefix_ok:
              sys.exit("VELMORA_RECOVERY_PREFIX is not lowercase segments that each end with a slash")
          if copy == "on" and not prefix_ok:
              sys.exit("VELMORA_RECOVERY_COPY is on and VELMORA_RECOVERY_PREFIX is missing")
          mode = os.environ.get("VELMORA_VERIFY_MODE", "") or "body"
          if mode not in ("body", "light"):
              sys.exit("VELMORA_VERIFY_MODE must be unset, body or light")
          layout = os.environ.get("VELMORA_RECORD_LAYOUT", "") or "flat"
          if layout not in ("flat", "tenant"):
              sys.exit("VELMORA_RECORD_LAYOUT must be unset, flat or tenant")

          maintenance = os.environ.get("VELMORA_MAINTENANCE", "") or "off"
          if maintenance not in ("off", "restore"):
              sys.exit("VELMORA_MAINTENANCE must be unset, off or restore")
          catalogue = os.environ.get("VELMORA_CATALOGUE_ID", "")
          if catalogue and not re.fullmatch(r"[a-z0-9_-]{1,32}", catalogue):
              sys.exit("VELMORA_CATALOGUE_ID must be unset or 1 to 32 of a-z 0-9 _ -")
          job_format = os.environ.get("VELMORA_JOB_FORMAT", "")
          if job_format not in ("", "1", "2"):
              sys.exit("VELMORA_JOB_FORMAT must be unset, 1 or 2")
          directory = os.environ.get("VELMORA_DIRECTORY_D1_ID", "")
          if directory and not re.fullmatch(uuid, directory):
              sys.exit("VELMORA_DIRECTORY_D1_ID must be unset or a lowercase UUID")
          if directory == dbid:
              sys.exit("VELMORA_DIRECTORY_D1_ID must not be the catalogue database")
          # The two key buckets of the tenant keys: KEYS_A creates, KEYS_B
          # holds the synchronous copy. Both or neither; each bucket must
          # exist before the variables are set.
          keys_a = os.environ.get("VELMORA_KEYS_A_BUCKET", "")
          keys_b = os.environ.get("VELMORA_KEYS_B_BUCKET", "")
          r2_name = re.compile(r"[a-z0-9][a-z0-9-]{1,61}[a-z0-9]")
          for name, value in (("VELMORA_KEYS_A_BUCKET", keys_a), ("VELMORA_KEYS_B_BUCKET", keys_b)):
              if value and not r2_name.fullmatch(value):
                  sys.exit(f"{name} must be unset or an R2 bucket name")
          if bool(keys_a) != bool(keys_b):
              sys.exit("VELMORA_KEYS_A_BUCKET and VELMORA_KEYS_B_BUCKET must be set together")
          if keys_a and keys_a == keys_b:
              sys.exit("VELMORA_KEYS_A_BUCKET and VELMORA_KEYS_B_BUCKET must not be the same bucket")

          with open(src, encoding="utf-8") as f:
              lines = f.read().split("\n")
          header = re.compile(r"\s*\[")
          # The prod section ends at the first [env.*] table header.
          end = next((i for i, l in enumerate(lines)
                      if re.match(r"\s*\[\[?env\.", l)), len(lines))
          def count_key(value, key):
              if isinstance(value, dict):
                  return (key in value) + sum(count_key(item, key) for item in value.values())
              if isinstance(value, list):
                  return sum(count_key(item, key) for item in value)
              return 0

          def assignment(key):
              return re.compile(rf'''\s*(?:{key}|"{key}"|'{key}')\s*[.=]''')

          try:
              shipped_prod = tomllib.loads("\n".join(lines[:end]))
          except tomllib.TOMLDecodeError:
              shipped_prod = {}  # The generated config is checked below.
          for key in ("S3_HOSTS", "CATALOGUE_ID", "JOB_FORMAT"):
              if any(assignment(key).match(line) for line in lines[:end]) or count_key(shipped_prod, key):
                  sys.exit(f"the prod section of the shipped file sets {key}")

          maintenance_line = re.compile(r'^\s*MAINTENANCE = "off"(\s+#.*)?$')
          hits = [i for i in range(end) if maintenance_line.fullmatch(lines[i])]
          if len(hits) != 1:
              sys.exit('expected exactly one prod line MAINTENANCE = "off"; use VELMORA_MAINTENANCE to change the deployed setting')
          maintenance_at = hits[0]
          tables = [line.strip() for line in lines[:maintenance_at] if header.match(line)]
          if tables[-1:] != ["[vars]"]:
              sys.exit("the prod MAINTENANCE line is not in the [vars] table")
          if (any(assignment("MAINTENANCE").match(lines[i]) for i in range(end) if i != maintenance_at)
                  or count_key(shipped_prod, "MAINTENANCE") > 1):
              sys.exit("the prod section sets MAINTENANCE a second time")

          shipped_d1 = shipped_prod.get("d1_databases", [])
          if (any(re.fullmatch(r'''\s*binding\s*=\s*["']DIRECTORY["']\s*(?:#.*)?''', line)
                  for line in lines[:end])
                  or any(db.get("binding") == "DIRECTORY" for db in shipped_d1)):
              sys.exit("the prod section of the shipped file binds DIRECTORY")
          shipped_r2 = shipped_prod.get("r2_buckets", [])
          key_bindings = ("KEYS_A", "KEYS_B")
          def tables_binding(value):
              # Every table, at any depth and of any binding type, whose
              # `binding` is a key binding.
              if isinstance(value, dict):
                  own = [value] if value.get("binding") in key_bindings else []
                  return own + [t for item in value.values() for t in tables_binding(item)]
              if isinstance(value, list):
                  return [t for item in value for t in tables_binding(item)]
              return []
          for binding in key_bindings:
              if (any(re.fullmatch(rf'''\s*binding\s*=\s*["']{binding}["']\s*(?:#.*)?''', line)
                      for line in lines[:end])
                      or any(t.get("binding") == binding for t in tables_binding(shipped_prod))):
                  sys.exit(f"the prod section of the shipped file binds {binding}")
          # Every bucket the file binds, production or not (the dev and drill
          # Workers delete in theirs): never a key bucket.
          bound_buckets = set(re.findall(r'''^\s*(?:preview_)?bucket_name\s*=\s*["']([^"']*)["']''',
                                         "\n".join(lines), re.M))
          try:
              whole = tomllib.loads("\n".join(lines))
          except tomllib.TOMLDecodeError:
              whole = {}
          def bucket_names(value):
              if isinstance(value, dict):
                  own = [value[k] for k in ("bucket_name", "preview_bucket_name") if isinstance(value.get(k), str)]
                  return own + [n for item in value.values() for n in bucket_names(item)]
              if isinstance(value, list):
                  return [n for item in value for n in bucket_names(item)]
              return []
          bound_buckets.update(bucket_names(whole))
          for name, value in (("VELMORA_KEYS_A_BUCKET", keys_a), ("VELMORA_KEYS_B_BUCKET", keys_b)):
              if value and value in bound_buckets:
                  sys.exit(f"{name} must not be a bucket the file already binds")
          entries = hosts.split(",") if hosts else []
          seen = {host}
          classes = []
          for entry in entries:
              name, _, host_class = entry.partition("=")
              if (len(entries) > 8 or len(name) > 253 or not hostname.fullmatch(name)
                      or host_class not in ("legacy", "customer") or name in seen):
                  sys.exit("VELMORA_S3_HOSTS must be a comma separated list of <lowercase host>=legacy|customer, at most 8, without S3_HOST or a repeat")
              seen.add(name)
              classes.append(host_class)
          subs = [
              ('S3_HOST = "velmora-s3.<account>.workers.dev"', f'S3_HOST = "{host}"'),
              ('database_id = "<from wrangler d1 create>"', f'database_id = "{dbid}"'),
          ]
          # One line in, two lines out with "on": the switch and its
          # prefix. Checked also when the switch is off.
          shipped = 'RECOVERY_COPY = "off"'
          subs.append((shipped, f'RECOVERY_COPY = "on"\nRECOVERY_PREFIX = "{prefix}"'
                       if copy == "on" else shipped))
          switch = [i for i in range(end) if lines[i].strip() == shipped]
          tables = [lines[i].strip() for i in range(switch[0] if switch else 0)
                    if header.match(lines[i])]
          if tables[-1:] != ["[vars]"]:
              sys.exit("the prod RECOVERY_COPY line is not in the [vars] table")
          if any(re.match(r"\s*RECOVERY_(COPY|PREFIX)\b", lines[i])
                 for i in range(end) if i not in switch):
              sys.exit("the prod section sets RECOVERY_COPY or RECOVERY_PREFIX a second time")
          # The verify mode: one line in, one line out.
          # The record layout: no line in, and with "tenant" one line
          # out, after the verify mode's. "flat" adds nothing: without
          # the variable the Worker writes the flat names.
          shipped_mode = 'VERIFY_MODE = "body"'
          tenant_line = '\nRECORD_LAYOUT = "tenant"' if layout == "tenant" else ""
          subs.append((shipped_mode, f'VERIFY_MODE = "{mode}"' + tenant_line))
          at = [i for i in range(end) if lines[i].strip() == shipped_mode]
          tables = [lines[i].strip() for i in range(at[0] if at else 0)
                    if header.match(lines[i])]
          if tables[-1:] != ["[vars]"]:
              sys.exit("the prod VERIFY_MODE line is not in the [vars] table")
          if any(re.match(r"\s*VERIFY_MODE\b", lines[i])
                 for i in range(end) if i not in at):
              sys.exit("the prod section sets VERIFY_MODE a second time")
          if any(re.match(r"\s*RECORD_LAYOUT\b", lines[i]) for i in range(end)):
              sys.exit("the prod section of the shipped file sets RECORD_LAYOUT")
          for placeholder, value in subs:
              hits = [i for i in range(end) if lines[i].strip() == placeholder]
              if len(hits) != 1:
                  sys.exit(f"expected exactly one prod line {placeholder!r}, found {len(hits)}")
              i = hits[0]
              indent = lines[i][: len(lines[i]) - len(lines[i].lstrip())]
              lines[i] = indent + value
              if hosts and placeholder.startswith("S3_HOST "):
                  lines[i] += f'\n{indent}S3_HOSTS = "{hosts}"'
          lines[maintenance_at] = lines[maintenance_at].replace('MAINTENANCE = "off"', f'MAINTENANCE = "{maintenance}"', 1)
          for key, value in (("CATALOGUE_ID", catalogue), ("JOB_FORMAT", job_format)):
              if value:
                  lines[maintenance_at] += f'\n{key} = "{value}"'

          directory_table = []
          if directory:
              catalogue_tables = [
                  i for i in range(end) if lines[i].strip() == "[[d1_databases]]"
              ]
              anchors = []
              for table in catalogue_tables:
                  stop = next((i for i in range(table + 1, end) if header.match(lines[i])), end)
                  if any(line.strip() == 'binding = "CATALOG"' for line in lines[table + 1:stop]):
                      anchors.extend(i for i in range(table + 1, stop)
                                     if lines[i].strip() == 'migrations_dir = "migrations"')
              if len(anchors) != 1:
                  sys.exit("expected exactly one prod CATALOG migrations_dir line")
              directory_table = [{
                  "binding": "DIRECTORY",
                  "database_name": "velmora-directory",
                  "database_id": directory,
                  "migrations_dir": "migrations-directory",
              }]
              lines[anchors[0]] += '\n\n[[d1_databases]]' + "".join(
                  f'\n{key} = "{value}"' for key, value in directory_table[0].items()
              )
          keys_tables = []
          if keys_a:
              cache_line = [i for i in range(end)
                            if lines[i].strip() == 'bucket_name = "velmora-cache-enam"']
              if len(cache_line) != 1:
                  sys.exit("expected exactly one prod CACHE bucket_name line")
              keys_tables = [{"binding": "KEYS_A", "bucket_name": keys_a},
                             {"binding": "KEYS_B", "bucket_name": keys_b}]
              lines[cache_line[0]] += "".join(
                  f'\n\n[[r2_buckets]]\nbinding = "{t["binding"]}"\nbucket_name = "{t["bucket_name"]}"'
                  for t in keys_tables
              )
          builds = [i for i in range(end) if lines[i].strip() == "[build]"]
          if len(builds) != 1:
              sys.exit(f"expected exactly one prod [build] table, found {len(builds)}")
          start = builds[0]
          stop = next(i for i in range(start + 1, len(lines)) if header.match(lines[i]))
          del lines[start:stop]
          text = "\n".join(lines)
          # The layout is read back from the text that is about to be
          # written, before the file exists: a refusal leaves no file.
          # No RECORD_LAYOUT at all is "flat" to the Worker.
          try:
              prod = tomllib.loads(text)
              prod_vars = prod["vars"]
              found = prod_vars.get("RECORD_LAYOUT")
          except (tomllib.TOMLDecodeError, KeyError, AttributeError):
              sys.exit("the generated config is not valid TOML with a prod [vars] table")
          if found != ("tenant" if layout == "tenant" else None):
              sys.exit("the generated config does not carry the record layout that was asked for")
          if prod_vars.get("S3_HOSTS") != (hosts or None):
              sys.exit("the generated config does not carry the S3 hosts that were asked for")
          for key, value in (("MAINTENANCE", maintenance), ("CATALOGUE_ID", catalogue or None),
                             ("JOB_FORMAT", job_format or None)):
              if prod_vars.get(key) != value:
                  sys.exit(f"the generated config does not carry the {key} that was asked for")
          expected_catalogue = [{**db, "database_id": dbid} for db in shipped_d1
                                if db.get("binding") == "CATALOG"]
          actual_d1 = prod.get("d1_databases", [])
          if (len(expected_catalogue) != 1
                  or [db for db in actual_d1 if db.get("binding") == "CATALOG"] != expected_catalogue
                  or [db for db in actual_d1 if db.get("binding") == "DIRECTORY"] != directory_table):
              sys.exit("the generated config does not carry the expected D1 bindings")
          actual_r2 = prod.get("r2_buckets", [])
          prod_only = {k: v for k, v in prod.items() if k != "env"}
          if ([b for b in actual_r2 if b.get("binding") in key_bindings] != keys_tables
                  or tables_binding(prod_only) != keys_tables
                  or [b for b in actual_r2 if b.get("binding") not in key_bindings]
                  != [b for b in shipped_r2 if b.get("binding") not in key_bindings]):
              sys.exit("the generated config does not carry the expected key bucket bindings")
          with open(dst, "w", encoding="utf-8") as f:
              f.write(text)
          print(f"wrangler.deploy.toml: prod placeholders substituted, prod [build] removed, recovery copy {copy}, verify mode {mode}")
          print(f"maintenance in the generated config: {maintenance}")
          print(f"catalogue id in the generated config: {catalogue or 'main (default)'}")
          print(f"job format in the generated config: {job_format or '1 (default)'}")
          print(f"directory database in the generated config: {'bound' if directory else 'none'}")
          print(f"key buckets in the generated config: {'bound' if keys_a else 'none'}")
          print(f"record layout in the generated config: {layout}")
          class_list = f" ({','.join(classes)})" if classes else ""
          print(f"extra S3 hosts in the generated config: {len(classes)}{class_list}")
          PY
      # The version serving 100% of traffic now, the rollback target. A
      # Worker that does not exist yet (first deploy) has none; any other
      # failure, or a split (gradual) deployment, stops the deploy.
      - id: prev
        name: Record the active Worker version
        if: steps.fresh.outputs.fresh == 'true'
        working-directory: workers/s3-bridge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/deployments-before.json"
          err="${RUNNER_TEMP}/deployments-before.err"
          if ./node_modules/.bin/wrangler deployments status --json -c wrangler.deploy.toml > "$out" 2> "$err"; then
            version=$(jq -r 'if (.versions | length) == 1 and .versions[0].percentage == 100 then .versions[0].version_id else empty end' "$out")
            if ! [[ "$version" =~ ^[0-9a-f-]{36}$ ]]; then
              echo "active deployment is not a single version at 100%; refusing to deploy"
              exit 1
            fi
            echo "active version before deploy: ${version}"
            echo "version=${version}" >> "$GITHUB_OUTPUT"
          elif grep -q 'code: 10007' "$err"; then
            echo "first deploy: the Worker does not exist yet, so there is no rollback target"
          else
            cat "$err"
            exit 1
          fi
      - name: Apply D1 migrations (remote)
        if: steps.fresh.outputs.fresh == 'true' && steps.switches.outputs.migrations == 'on'
        working-directory: workers/s3-bridge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ./node_modules/.bin/wrangler d1 migrations apply velmora-catalog --remote -c wrangler.deploy.toml
      - name: Check that no catalogue migration is pending
        if: steps.fresh.outputs.fresh == 'true' && steps.switches.outputs.migrations == 'off'
        working-directory: workers/s3-bridge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/catalogue-migrations-list.log"
          echo "catalogue migrations skipped (VELMORA_CATALOGUE_MIGRATIONS=off)"
          status=0
          ./node_modules/.bin/wrangler d1 migrations list velmora-catalog --remote -c wrangler.deploy.toml > "$out" 2>&1 || status=$?
          cat "$out"
          if [ "$status" -ne 0 ]; then
            echo "::error::could not list catalogue migrations; refusing to deploy"
            exit 1
          fi
          if ! grep -qiF 'No migrations to apply!' "$out"; then
            echo "::error::a catalogue migration is pending while VELMORA_CATALOGUE_MIGRATIONS is off; refusing to deploy"
            exit 1
          fi
      - name: Apply directory migrations (remote)
        if: steps.fresh.outputs.fresh == 'true' && vars.VELMORA_DIRECTORY_D1_ID != ''
        working-directory: workers/s3-bridge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ./node_modules/.bin/wrangler d1 migrations apply velmora-directory --remote -c wrangler.deploy.toml
      - id: deploy
        name: Deploy the Worker
        if: steps.fresh.outputs.fresh == 'true'
        working-directory: workers/s3-bridge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Structured (ND-JSON) output, read below for the version id.
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        # The version message identifies this run's version even when
        # wrangler fails before writing its deploy output entry.
        # --x-provision=false: a binding to a resource that does not exist
        # fails the upload; wrangler never creates one (for a token with
        # read access it would, with no location hint).
        run: ./node_modules/.bin/wrangler deploy -c wrangler.deploy.toml --x-provision=false --message "ci ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT} ${GITHUB_SHA}"
      # An unsigned GET must be refused with 403 and an S3 AccessDenied
      # body. Retries cover the propagation window right after deploy.
      - id: smoke
        name: Smoke test (unsigned GET is refused)
        if: steps.fresh.outputs.fresh == 'true'
        env:
          VELMORA_S3_HOST: ${{ vars.VELMORA_S3_HOST }}
          VELMORA_S3_HOSTS: ${{ vars.VELMORA_S3_HOSTS }}
        run: |
          set -euo pipefail
          body="${RUNNER_TEMP}/smoke-body"
          hosts=("$VELMORA_S3_HOST")
          if [ -n "$VELMORA_S3_HOSTS" ]; then
            IFS=, read -r -a entries <<< "$VELMORA_S3_HOSTS"
            for entry in "${entries[@]}"; do
              hosts+=("${entry%%=*}")
            done
          fi
          for i in "${!hosts[@]}"; do
            host="${hosts[i]}"
            index=$((i + 1))
            if ! [[ "$host" =~ ^[a-z0-9]([a-z0-9.-]{0,251}[a-z0-9])?$ ]]; then
              echo "smoke: invalid host at index ${index}"
              exit 1
            fi
            if [ "${#hosts[@]}" -gt 1 ]; then
              echo "smoke: checking host ${index}"
            fi
            code=none
            for attempt in 1 2 3 4 5 6; do
              code=$(curl -sS -o "$body" -w '%{http_code}' --connect-timeout 10 --max-time 30 \
                "https://${host}/" || true)
              echo "attempt ${attempt}: HTTP ${code}"
              if [ "$code" = "403" ] && grep -q '<Code>AccessDenied</Code>' "$body"; then
                continue 2
              fi
              sleep 10
            done
            echo "smoke: expected HTTP 403 AccessDenied for an unsigned GET, last got ${code} (host index ${index})"
            exit 1
          done
      # On any failure or cancellation after the rollback target was
      # recorded: roll back to that exact version, but only when the active
      # version is the one this run deployed (from the wrangler output), so
      # a deployment made outside this job is never replaced. Any other
      # state fails the step for a manual check.
      - id: rollback
        name: Roll back to the recorded version
        if: ${{ (failure() || cancelled()) && steps.prev.outputs.version != '' }}
        working-directory: workers/s3-bridge
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FLOOR_VERSION: ${{ steps.switches.outputs.floor_version }}
          PREV_VERSION: ${{ steps.prev.outputs.version }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
        run: |
          set -euo pipefail
          deployed=""
          if [ -f "$WRANGLER_OUTPUT_FILE_PATH" ]; then
            deployed=$(jq -r 'select(.type == "deploy") | .version_id // empty' "$WRANGLER_OUTPUT_FILE_PATH" | tail -n 1)
          fi
          out="${RUNNER_TEMP}/deployments-after.json"
          active=""
          for _ in 1 2 3; do
            if ./node_modules/.bin/wrangler deployments status --json -c wrangler.deploy.toml > "$out"; then
              active=$(jq -r 'if (.versions | length) == 1 and .versions[0].percentage == 100 then .versions[0].version_id else empty end' "$out")
              break
            fi
            sleep 5
          done
          if [ -n "$active" ] && [ "$active" = "$PREV_VERSION" ]; then
            echo "rollback: active version is still ${PREV_VERSION}; nothing to roll back"
            exit 0
          fi
          view_version() {
            local attempt
            for attempt in 1 2 3; do
              if ./node_modules/.bin/wrangler versions view "$1" --json -c wrangler.deploy.toml > "$2"; then
                return 0
              fi
              if [ "$attempt" -lt 3 ]; then
                sleep 5
              fi
            done
            return 1
          }
          # wrangler writes its deploy output entry only after the trigger
          # and queue-consumer updates, so a failure or cancellation there
          # leaves no id although the new version is live. Adopt the active
          # version only if its message is exactly this run's.
          if [ -z "$deployed" ] && [ -n "$active" ]; then
            message=""
            if view_version "$active" "${RUNNER_TEMP}/active-version.json"; then
              message=$(jq -r '.annotations["workers/message"] // empty' "${RUNNER_TEMP}/active-version.json")
            fi
            if [ "$message" = "ci ${GITHUB_RUN_ID}.${GITHUB_RUN_ATTEMPT} ${GITHUB_SHA}" ]; then
              echo "rollback: active version ${active} carries this run's message; treating it as this run's deploy"
              deployed="$active"
            fi
          fi
          if [ -z "$deployed" ]; then
            echo "::error::rollback: this run has no deployed version id and the active version is '${active:-unknown}', not ${PREV_VERSION}; not rolling back, check manually"
            echo "rollback=manual-check" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          if [ -n "$active" ] && [ "$active" != "$deployed" ]; then
            echo "::error::rollback: active version ${active} is neither ${PREV_VERSION} nor this run's ${deployed}; not rolling back, check manually"
            echo "rollback=manual-check" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          # active is this run's version, or could not be read after a
          # deploy this run made: restore the recorded version.
          if [ -n "$FLOOR_VERSION" ] && [ "$FLOOR_VERSION" != "$PREV_VERSION" ]; then
            target_json="${RUNNER_TEMP}/rollback-target.json"
            floor_json="${RUNNER_TEMP}/rollback-floor.json"
            comparison=2
            if view_version "$PREV_VERSION" "$target_json" && view_version "$FLOOR_VERSION" "$floor_json"; then
              comparison=0
              python3 -I - "$target_json" "$floor_json" <<'PY' || comparison=$?
          from datetime import datetime
          import json, sys

          def created_on(path):
              with open(path, encoding="utf-8") as source:
                  timestamp = datetime.fromisoformat(json.load(source)["metadata"]["created_on"])
              if timestamp.tzinfo is None:
                  raise ValueError("missing timestamp offset")
              return timestamp

          try:
              sys.exit(created_on(sys.argv[1]) < created_on(sys.argv[2]))
          except (OSError, KeyError, TypeError, ValueError):
              sys.exit(2)
          PY
            fi
            if [ "$comparison" -eq 0 ]; then
              echo "rollback target meets the configured floor version"
            elif [ "$comparison" -eq 1 ]; then
              echo "::error::rollback refused: the recorded version ${PREV_VERSION} is older than the rollback floor version ${FLOOR_VERSION}; production stays on ${deployed}; check manually"
              echo "rollback=refused-floor" >> "$GITHUB_OUTPUT"
              exit 1
            else
              echo "::error::rollback refused: the age of the recorded version ${PREV_VERSION} against the floor version ${FLOOR_VERSION} could not be read; production stays on ${deployed}; check manually"
              echo "rollback=refused-floor-unknown" >> "$GITHUB_OUTPUT"
              exit 1
            fi
          fi
          rollback_log="${RUNNER_TEMP}/rollback.log"
          if ! ./node_modules/.bin/wrangler rollback "$PREV_VERSION" -c wrangler.deploy.toml \
            --message "automatic rollback: deploy job failed or was cancelled" -y > "$rollback_log" 2>&1; then
            cat "$rollback_log"
            echo "::error::wrangler rollback failed (Cloudflare refused it or the call failed; see the output above); production stays on ${deployed}; check manually"
            echo "rollback=refused" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          cat "$rollback_log"
          echo "rollback=done" >> "$GITHUB_OUTPUT"
          echo "Deploy failed or was cancelled; rolled back from \`${deployed}\` to Worker version \`${PREV_VERSION}\`." >> "$GITHUB_STEP_SUMMARY"
      - name: Record the Worker version id
        if: steps.fresh.outputs.fresh == 'true'
        env:
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
          PREV_VERSION: ${{ steps.prev.outputs.version }}
        run: |
          set -euo pipefail
          version_id=$(jq -r 'select(.type == "deploy") | .version_id // empty' "$WRANGLER_OUTPUT_FILE_PATH" 2>/dev/null | tail -n 1 || true)
          # The deploy already passed its smoke test; a missing id is a
          # reporting problem only and must not trigger a rollback.
          if [ -z "$version_id" ]; then
            echo "::warning::no version id in the wrangler output"
            version_id="unknown (see the deploy step log)"
          fi
          {
            echo "### Worker deployed"
            echo ""
            echo "- Commit: \`${GITHUB_SHA}\`"
            echo "- Worker version id: \`${version_id}\`"
            echo "- Previous version id: \`${PREV_VERSION:-none}\`"
          } >> "$GITHUB_STEP_SUMMARY"

  # Emails the operator when the production deploy fails (it then rolls
  # back), its build fails, or checks fail on main. The alert goes through
  # the alerts Worker's report endpoint (workers/alerts). Both values live
  # in the `production` environment:
  # vars.ALERTS_INGEST_URL and secrets.ALERTS_INGEST_TOKEN; without them
  # this job only writes a warning. It never fails the run itself. The
  # token reaches curl on stdin, never argv, and curl's own messages (which
  # would name the host) stay out of the public log.
  deploy-alert:
    name: deploy alert
    needs: [ci-ok, deploy-build, deploy]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.ci-ok.result != 'cancelled' && (needs.ci-ok.result == 'failure' || needs.deploy-build.result == 'failure' || needs.deploy.result == 'failure' || needs.deploy.result == 'cancelled') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: production
    permissions:
      contents: read
    steps:
      - name: Report the failed deploy
        env:
          ALERTS_INGEST_URL: ${{ vars.ALERTS_INGEST_URL }}
          ALERTS_INGEST_TOKEN: ${{ secrets.ALERTS_INGEST_TOKEN }}
          CI_RESULT: ${{ needs.ci-ok.result }}
          BUILD_RESULT: ${{ needs.deploy-build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          ROLLBACK: ${{ needs.deploy.outputs.rollback }}
          REFUSED: ${{ needs.deploy.outputs.refused }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          if [ -z "${ALERTS_INGEST_URL}" ] || [ -z "${ALERTS_INGEST_TOKEN}" ]; then
            echo "::warning::deploy alert not sent: ALERTS_INGEST_URL or ALERTS_INGEST_TOKEN is not set in the production environment"
            exit 0
          fi
          body=$(jq -n --arg sha "$GITHUB_SHA" --arg ci "$CI_RESULT" --arg b "$BUILD_RESULT" --arg d "$DEPLOY_RESULT" --arg run "$RUN_URL" --arg rollback "$ROLLBACK" --arg refusal "$REFUSED" '
            ($rollback == "refused" or $rollback == "refused-floor"
             or $rollback == "refused-floor-unknown" or $rollback == "manual-check") as $refused | {
            source: "ci",
            key: (if $ci == "failure" then "ci-failed" elif $refused then "deploy-rollback-refused" else "deploy-failed" end),
            title: (if $ci == "failure" then "Checks failed on main"
                    elif $rollback == "manual-check" then "Production deploy failed; rollback needs a manual check"
                    elif $refused then "Production deploy failed and was not rolled back" else "Production deploy failed" end),
            detail: ((if $rollback == "manual-check" then "The active Worker version needs a manual check. "
                      elif $refused then "The rollback was refused (\($rollback)): production runs the version this run deployed. " else "" end)
              + "Commit \($sha): deploy build \($b), deploy \($d). "
              + (if $ci == "failure" then "The checks failed on main, so nothing was deployed."
                 elif $b == "failure" then "The build failed, so nothing was deployed; production is unchanged."
                 elif $refusal == "freeze" then "The deploy was refused by the deploy freeze; nothing was deployed."
                 elif $refusal == "switches" then "The deploy switches refused this commit (see the \"Check the deploy switches\" step); nothing was deployed."
                 else "The deploy job rolls back to the version before it when it can; whether it did, or asks for a manual check, is in the run'"'"'s \"Roll back to the recorded version\" step." end)
              + " Run: \($run)")}')
          if printf 'Authorization: Bearer %s\n' "$ALERTS_INGEST_TOKEN" \
            | curl -fs --max-time 30 -H @- -H 'Content-Type: application/json' \
                --data "$body" "${ALERTS_INGEST_URL%/}/v1/alert" >/dev/null 2>&1; then
            echo "deploy alert sent"
          else
            echo "::warning::deploy alert could not be delivered"
          fi
