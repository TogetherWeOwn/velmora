[package]
name = "velmora-s3-bridge"
version = "0.1.0"
edition = "2021"
# The locked Worker SDK (worker 0.8.7) requires Rust 1.91.
rust-version = "1.91"
description = "Cloudflare Worker for the velmora S3 bridge: thin adapters from Workers bindings to the velmora-bridge ports"
license = "MIT"
repository = "https://github.com/TogetherWeOwn/velmora"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

# Every dependency the adapter lanes need is declared here once (the
# manifest is frozen with the contract).
[dependencies]
velmora-bridge = { version = "0.1.0", path = "../../crates/velmora-bridge" }
velmora = { version = "0.1.0", path = "../../crates/velmora", default-features = false, features = ["worker-transport"] }
worker = { version = "0.8", features = ["d1", "queue"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
