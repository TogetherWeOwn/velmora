[package]
name = "velmora-s3-bridge"
version = "0.1.0"
edition = "2021"
# The locked Worker SDK (worker 0.8.7) requires Rust 1.91.
rust-version = "1.91"
description = "Cloudflare Worker for the velmora S3 bridge: thin adapters from Workers bindings to the velmora-bridge ports"
license = "MIT"
repository = "https://github.com/TogetherWeOwn/velmora"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

# Every dependency the adapter lanes need is declared here once (the
# manifest is frozen with the contract).
[dependencies]
velmora-bridge = { version = "0.1.0", path = "../../crates/velmora-bridge" }
velmora = { version = "0.1.0", path = "../../crates/velmora", default-features = false, features = ["worker-transport", "worker-socks5-tls"] }
worker = { version = "0.8", features = ["d1", "queue"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

# The function names in the release bundle stay in Rust's mangled form
# (wasm-bindgen would otherwise spell each one out, generic arguments and
# crate hashes included). The names are all still there, so a wasm frame
# in a stack trace reads through `rustfilt`; the code is the same.
# Measured on this tree: about 99,000 bytes less of the 3,000,000 budget.
[package.metadata.wasm-pack.profile.release.wasm-bindgen]
demangle-name-section = false
