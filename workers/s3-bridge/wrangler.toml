name = "velmora-s3"
# entry.mjs wraps the Rust Worker (build/index.js): the default
# entrypoint deletes the entry marker a client may send, and the named
# entrypoint `DavEntry` (no route; reached only through a service binding
# that names it) marks a request as the WebDAV gateway's. See entry.mjs
# and crates/velmora-bridge/src/entry.rs.
main = "entry.mjs"
compatibility_date = "2026-11-01"

# The account id comes from the deploy environment (CLOUDFLARE_ACCOUNT_ID),
# never from this file. Binding ids below are placeholders until the
# resources are created.

[build]
# worker-build 0.8.7 matches the locked workers-rs 0.8.7 (the 0.7 line does
# not). `--locked` installs it from its own lockfile.
command = "cargo install -q --locked worker-build@0.8.7 && bash bundle.sh"

[limits]
cpu_ms = 300000              # crypto-heavy fetch + queue handlers; measure, then lower

# Run the fetch handler next to the catalogue and the buckets. The
# production D1 and both R2 buckets are in ENAM; aws:us-east-1 serves
# from IAD. A request is mostly D1 and R2 round trips, so this cuts its
# time for a client anywhere. Placement moves fetch handlers only:
# queue consumers, cron and the Durable Object are where they were.
# Measured on a throwaway deployment with an ENAM D1, placed against
# unplaced (client in Europe): PutObject 1 MiB p50 -30%, hot GET TTFB
# -25%, cold GET MiB/s +82%, cold 1 MiB TTFB -71%. Rollback: remove
# this table (or set mode = "off") and deploy; a version without it
# runs unplaced again.
[placement]
mode = "targeted"
region = "aws:us-east-1"

[vars]
# PostgreSQL bindings are activated only during the catalogue cutover.
CATALOG_BACKEND = "d1"
PG_PIPELINE = "1"
ENVIRONMENT = "prod"
S3_HOST = "velmora-s3.<account>.workers.dev"
S3_REGION = "auto"
MAX_EXTENT_BYTES = "16777216"
REQUIRED_BACKBONES = "2"
# A copy is released once two backbones that count hold every article
# when the release job asks them again (STAT), with no added wait: the
# release follows the verify that passed on both. Measured in production
# (2026-11-16..20): of 287,742 extents asked again 24-72 h after their
# post, none had lost an article on either backbone, so a wait caught
# nothing. A value above 0 delays every release by that many seconds
# after the newest post or repost of the extent's articles. Under the
# light VERIFY_MODE it is also how long a backbone the sample raises
# (VERIFY_ESCALATE_SECS) still reaches extents that passed on STAT
# alone: a raise covers only extents still held. At 0 it reaches none
# released before it.
SAFETY_MIN_AGE_SECS = "0"
VERIFY_DELAY_SECS = "120"
# RELEASE_AT_VERIFY (off): off | on. Who releases a copy whose verify round
# passed when SAFETY_MIN_AGE_SECS is already over (always, when it is 0).
# off: the release job, which asks every backbone that counts again (STAT).
# on: the verify job itself, on the checks it has just recorded under its
# own claim: one round of questions for an extent instead of two, and one
# job instead of two. A backbone that job did not ask itself (it resumed
# an earlier round, or its check began before the minimum age was over)
# is asked (STAT) before the release. The rule is the same either way:
# REQUIRED_BACKBONES backbones that count hold every article, by checks
# made under the claim that releases, and the full read is on record.
# A round that ends before the minimum age is over (counted from the
# newest post, a repost included) goes to the release job as before,
# whatever this says. The release by a verify job is one
# write (copy released and row done together), so Workers of both values
# and older Workers may run side by side. Its count in the release
# totals needs migration 0025.
RELEASE_AT_VERIFY = "off"
# How the verify stage checks an extent: body | light.
# body: every article is read in full (BODY) on one backbone that counts
# and asked for (STAT) on the others.
# light: every article is asked for (STAT) on every backbone that counts,
# and its size as the provider reports it is held against the size of the
# article that was posted; a sample of the extents is read in full as
# under body. The sample is drawn from the extent id under a key derived
# from the active KEK, so a retry draws the same answer. A full read that
# fails on a backbone that still lists the article puts that backbone
# under full reads for every extent for VERIFY_ESCALATE_SECS, logs an
# alert, and shows in the cron report as `verify_escalated`.
# Both ways keep REQUIRED_BACKBONES, SAFETY_MIN_AGE_SECS and the STAT of
# every article at release (under RELEASE_AT_VERIFY on, the check of the
# verify job that releases is that one). The value is read by the job that runs, so
# Workers of both values may run side by side: an extent verified under
# body is released by either, one verified under light is read in full
# before a Worker under body releases it.
# Companions of light, all optional:
#   VERIFY_SAMPLE_PERCENT  extents read in full, default 2; below 1 is
#                          refused outside dev.
#   VERIFY_ESCALATE_SECS   default 86400, from 60 to 2592000.
#   VERIFY_SIZE_COMMANDS   a JSON object of provider id to hdr | over |
#                          head: the command that returns the size of an
#                          article by message-id on that provider (HDR
#                          :bytes, OVER, or HEAD and its Bytes header).
#                          Only a size the provider counted itself is
#                          recorded as a size check. A size that came
#                          with the article (X-Received-Bytes under
#                          HEAD) must fit too, but a pass is recorded as
#                          presence. A provider without an entry, or an
#                          answer without a size, is checked with STAT
#                          alone. The verification row says which it was.
# Under light the articles of an extent are asked for together on each
# provider (the commands written ahead of their replies): a round trip
# for an extent instead of one per article, at verify and at release.
# A raised backbone is read in full for every extent stored before the
# period ends, whenever its job runs, and counts at release only with
# that full read on record.
# Without VERIFY_MODE the stage runs as body.
# The production deploy writes this line from the variable
# VELMORA_VERIFY_MODE of its environment (unset: body). It is the only
# place the production value is set: a var set outside the deploy is gone
# after the next one.
VERIFY_MODE = "body"
# One group per article, drawn at random. Each was posted to from every
# posting account and read back by message-id on every account.
NEWSGROUPS = "alt.binaries.boneless,alt.binaries.misc,alt.binaries.multimedia,alt.binaries.test"
VELMORA_KEK_ACTIVE = "1"
INFLIGHT_BUDGET_BYTES = "50331648"   # 48 MiB per isolate: what requests may charge
# What requests and background jobs may charge together, per isolate. A
# job charges under this limit, a request under INFLIGHT_BUDGET_BYTES. It
# may be up to 1.5 times INFLIGHT_BUDGET_BYTES or 90 MiB, whichever is
# more: a request holds up to 1.5 bytes per byte it charges (the upload's
# ciphertext is copied once more on its way to R2), a job holds about
# what it charges. An upload of at most MAX_EXTENT_BYTES is sealed and
# stored while it arrives and charges a window of 512 KiB whatever its
# length; a slice, a copied part and a download charge what they hold.
# 90 MiB holds three post jobs with parity (29.13 MiB each) and a verify
# job. Measured with three post jobs at once in one isolate: wasm memory
# up to 92 MiB without parity and 103 MiB with it, of the isolate's
# 128 MiB; four with parity (4 sockets each, 104.5 MiB charged) reached
# 119 MiB and none ran out of memory
# (MAX_JOB_BUDGET_BYTES in config.rs).
JOB_BUDGET_BYTES = "94371840"        # 90 MiB per isolate
GC_MODE = "off"                      # off | disposable
HOT_CAP_BYTES = "107374182400"       # 100 GiB of evictable R2 bytes; pinned (unverified) bytes are never counted or evicted
MAINTENANCE = "off"                  # off | restore
# Sockets per post job, spread over the posting tier. A post job charges
# its extent (16 MiB) plus 1.5 MiB per socket to the isolate's byte budget
# (and 4.13 MiB more for its parity with PARITY on), and the invocations
# of one queue share an isolate. At 6, three post jobs and a verify job
# fit the 90 MiB job budget at once, with parity or without, and a fourth
# post job waits; at 8 only two post jobs with parity fit beside a verify
# job and the third waits.
POST_SOCKETS = "6"
# Connections one GET reads extents from Usenet over, 1 to 8. They leave
# from one address and each is one provider permit; a read that gets
# fewer permits reads over fewer. At 8 an invocation holds one extent,
# the articles on the wire and the cache write of the extent before it
# within the 48 MiB above. See "A GET above GET_FANOUT_BYTES" in
# ops/README.md for what was measured.
COLD_SOCKETS = "8"
# The largest body of a PutObject or an UploadPart: 99 MiB, the most this
# build takes. A request body above 100 MiB is refused before it reaches
# the Worker, and the margin is for chunked framing. A body above
# MAX_EXTENT_BYTES is stored as slices of SLICE_BYTES, one in memory at a
# time. Without the variable the limit is MAX_EXTENT_BYTES. A part made
# by UploadPartCopy stays at MAX_EXTENT_BYTES.
MAX_PUT_BYTES = "103809024"
# off | on. On: the cron tick removes the slices of a sliced PutObject
# that was never published, or of a sliced UploadPart that was never
# stored, a day after it began. It deletes nothing of
# a write that has a recovery record, nothing while a replay is under
# way, and nothing while the catalogue is behind its rollback stamp.
# Independent of GC_MODE. Off: the slices and their rows stay, and a
# later run with the switch on removes them. Production ships with it
# off; /_admin/status counts what it would take (write_intents:
# waiting_writes, oldest_waiting_at).
INTENT_SWEEP = "off"
# off | on. On: the recovery records of SAFETY (m/) are copied to a
# bucket at another S3-compatible provider, so that the records survive
# the loss of this account. Every 15 minutes a pass sends the records of
# the last hour (deletes, writes and their article plans); an article
# plan written later is sent by a job of its own when its extent is
# posted; and once a day a walk compares every record with the copy (in
# three hours when a job left something undone), so that what a pass
# lists follows what is written, not what is stored. It puts only what is missing
# or different there (key, size, MD5), proves each put with a HEAD, and
# never deletes there. Tenant keys (m/tk/) are not copied, a generation
# record is copied once it is two minutes old, and no pass runs while
# MAINTENANCE is "restore". A key there that this service did not write
# is counted (`foreign`) and left alone. With `on`
# these are required, each as a var or a secret:
#   E2_ENDPOINT (https://host), E2_REGION, E2_BUCKET,
#   RECOVERY_PREFIX (put before every key; ends with "/"),
#   E2_ACCESS_KEY and E2_SECRET_KEY (secrets; a key that cannot delete).
# A missing or refused value stops the copy only, with an error line on
# every cron run; it never stops the S3 service.
RECOVERY_COPY = "off"
# d1 | do. Where provider connection permits come from. d1: slot rows of
# the catalogue (provider_permits), a row write for every acquire,
# renewal and release. do: the permit gate (see below) holds them in memory
# and the catalogue writes none. Both kinds of Worker can run against one
# catalogue: a gate hands out nothing on an account until it holds every
# slot row of it, and gives the rows back only once nothing it handed out
# is live. Change it in a deploy of its own, with the provider limits and
# pools unchanged in that deploy. See "Permit gate" in ops/README.md.
# Production: "do" since deploy 4 of "Shipping the gate"; to undo it,
# set "d1" again (the gates hand their slot rows back).
PERMITS = "do"
# Optional vars and their defaults (production sets POST_SOCKETS and COLD_SOCKETS explicitly):
#   S3_HOSTS (empty): up to eight comma-separated entries. Join each hostname and class with an equals sign.
#     Classes are legacy and customer.
#     S3_HOST is always legacy. Production takes its extra hosts from VELMORA_S3_HOSTS.
#     Attach each host to the Worker as a Custom Domain before naming it in the variable,
#     or the smoke test fails and the deploy rolls back.
#   SLICE_BYTES (8388608, 8 MiB): the slice of a PutObject or UploadPart body above MAX_EXTENT_BYTES; at most MAX_EXTENT_BYTES.
#   MAX_OBJECT_EXTENTS (10000): most extents one object is made of, 1 to 10000. CompleteMultipartUpload, and an UploadPart
#     above MAX_EXTENT_BYTES, answer 400 EntityTooLarge for an upload that would hold more. With slices of 8 MiB that is 78 GiB in parts above
#     MAX_EXTENT_BYTES, and 156 GiB in parts of exactly MAX_EXTENT_BYTES.
#   MAX_PUT_BYTES (MAX_EXTENT_BYTES): see above. INTENT_SWEEP (off): see above.
#   GC_ORPHANS (off): off | on. On: the cron deletes the pinned copy of an upload part that left its upload (uploaded again under
#     its number, aborted, or left out of the part list of a completion) 31 days after it left, in every bucket and whatever
#     GC_MODE says. It takes nothing an object, a server-side copy or an open upload refers to, nothing of a key that has a
#     write whose outcome is not known, and nothing while a replay is under way, for 31 days after one ended, or while the
#     catalogue is behind its rollback stamp.
#     Not set here: read "Upload parts that left their upload" in ops/README.md before turning it on.
#   CATALOGUE_ID (main): names this catalogue in its rollback stamp keys in SAFETY (rs/<id>/<counter>). Never change it for a catalogue in use.
#   POST_SOCKETS (4): connections one post job opens, 1 to 8, each on its own provider permit.
#     A job is one source address to a provider, however many connections it holds there.
#   COLD_SOCKETS (4; production sets 8 above): connections one GET reads from Usenet over, 1 to 8, each on its own
#     provider permit. Fewer are used when INFLIGHT_BUDGET_BYTES has no room for that many beside an extent and its cache write.
#   JOB_BUDGET_BYTES (the value of INFLIGHT_BUDGET_BYTES): see above; from that value to 1.5 times it or 90 MiB, whichever is more.
#   RECORD_LAYOUT (flat): flat | tenant. Where NEW recovery records are written: flat is m/<id>, m/del/<id> and m/art/<extent>;
#     tenant is the same names under m/x/<tenant id>/. Every reader reads both, always, and no record is ever renamed.
#     A Worker from before this switch does not read the tenant names (its replay would pass over them): set tenant in a
#     deploy AFTER the one that brought the switch, and from then on never roll back past that one (see "Rollback floor"
#     and "Record layout" in ops/README.md). Not set here, and never to be set here: the deploy job writes it into the
#     production config from the variable VELMORA_RECORD_LAYOUT of the production environment, and refuses a prod section that sets it.
#   PROPAGATION_GRACE_SECS (21600, 6 h): after it, an article a backbone still lacks is posted to that backbone.
#   PACKED_PLANS (off; production sets it on below): off | on. On: the article plan of a new extent is one value on its row
#     (extents.plan) instead of one row per article, a replay stores plans that way, and each
#     cron tick packs up to 50 older plans whose articles are all posted and deletes their rows
#     (POST /_admin/pack-plans does a step by hand). A Worker from before this switch
#     cannot read a packed plan: turn it on in a deploy AFTER the one that brought the switch,
#     and from then on never roll back past that one (see "Rollback floor" in ops/README.md).
#   PARITY (off): off | on. On: the plan of a new extent gets a parity addendum (extents.parity, migration 0022) and its
#     parity articles are posted with its data articles: one per six data articles, at least one. Only with
#     PACKED_PLANS on: on without it, the Worker refuses its configuration. An addendum that is stored is posted and read whatever the switch says. A Worker from before
#     this switch ignores an addendum: it reads every plan as before, and an extent it posts or releases is left
#     without its parity articles. Not set here: production posts no parity yet.

# off | on (CopyObject only; UploadPartCopy does not read it). On only in a
# release after the one that added extent references (migration 0005): a
# rollback must never land on a Worker that cannot read a copy or would
# collect the extents it shares. See "Rollback floor" in ops/README.md.
SERVER_SIDE_COPY = "on"
# Packed article plans (see PACKED_PLANS above). On from the second deploy that
# knows the switch; from then on, never roll back below the first one that knows
# it ("Rollback floor" in ops/README.md).
PACKED_PLANS = "on"
# A GET (or ranged GET) of more plaintext bytes than this is served in
# sub-ranges of this size: the invocation that answers the client asks
# this Worker for each sub-range in turn through the SELF binding below,
# and each of those runs under its own CPU limit. One invocation reads
# about 9 GiB from the cache within cpu_ms, and 4 to 7 GiB from Usenet,
# so 1 GiB leaves a wide margin. From 1 MiB to 2 GiB; unset or "0"
# serves every GET in one invocation. A GET of more than 8,192
# sub-ranges (8 TiB at 1 GiB) is refused. See "A GET above
# GET_FANOUT_BYTES" in ops/README.md.
GET_FANOUT_BYTES = "1073741824"

# Request metrics: one request in METRICS_SAMPLE (default 10) and every
# 5xx is a data point with method, status, latency, bytes and colo; a
# run of reads from Usenet (cache misses) is a point of its own. No bucket, key,
# query, header or request id is written. Without this binding the
# Worker writes none. See "Usage counters and metrics" in ops/README.md.
[[analytics_engine_datasets]]
binding = "METRICS"
dataset = "velmora_requests"

# This Worker, bound to itself: `service` must be the name above. The
# sub-requests of a large GET go through it and never through the
# internet; one that arrives from the internet is refused.
[[services]]
binding = "SELF"
service = "velmora-s3"

# The permit gate (src/gate.rs, class PermitGate) is declared and bound
# here, and this Worker takes its permits from it (PERMITS = "do" above,
# deploy 4 below, shipped in a deploy of its own).
# Declaring a Durable Object class is a deploy that can never be rolled
# back past, so the class, its binding and PERMITS = "do" each come in a
# deploy of their own, in this order (see "Shipping the gate" in
# ops/README.md, which has the exact tables):
#   2. `[exports.PermitGate]` alone (one-way; nothing can reach it).
#   3. The `PERMIT_GATE` binding and `[version_metadata]` (reversible; a
#      rollback goes to the deploy 2 version, never below it).
#   4. PERMITS = "do" (reversible).
# Never with the legacy `[[migrations]]` array: once a class is declared
# by `exports`, Cloudflare refuses a deploy that goes back to it.
[exports.PermitGate]
type = "durable-object"
storage = "sqlite"

[[durable_objects.bindings]]
name = "PERMIT_GATE"
class_name = "PermitGate"

[version_metadata]
binding = "CF_VERSION_METADATA"

[[d1_databases]]
binding = "CATALOG"
database_name = "velmora-catalog"
database_id = "<from wrangler d1 create>"
migrations_dir = "migrations"

# Activate and supply real config IDs together at cutover. Leaving these
# commented preserves stock D1 deploys (unbound or fake IDs would fail deploy).
# Use direct PostgreSQL (5432) as the Hyperdrive origin; configure host/port on
# Hyperdrive and disable caching. The app role must default to read-only.
# Do not use the pooled origin (6432): it did not preserve the role default.
# Initial origin limits: writes 5, reads 8. Direct origin on 25 connections:
# 3 superuser-reserved; 5 write + 8 read + 5 temporary drill + 4 ops = 22.
# Without the drill there are 5 spare. Do not reuse a drill ID in production.
# [[hyperdrive]]
# binding = "CATALOG_PG_W"
# id = "<write Hyperdrive config ID>"
# [[hyperdrive]]
# binding = "CATALOG_PG_R"
# id = "<read Hyperdrive config ID>"

# Production data lives in US East (ENAM). R2 honours a location hint only the
# first time a bucket name is created, so the region is part of the name.
[[r2_buckets]]
binding = "SAFETY"
bucket_name = "velmora-safety-enam"

[[r2_buckets]]
binding = "CACHE"
bucket_name = "velmora-cache-enam"

# Jobs are spread over several queues of each kind. The invocations of one
# queue's consumer mostly land in one isolate: one byte budget
# (JOB_BUDGET_BYTES) and one thread, which a post job or a full verify
# read keeps busy for about a second per extent. Measured: eight
# invocations on one queue posted no faster than three (they wait for the
# budget and are deferred), while four queues of three ran in seven
# isolates and posted four times as fast. So throughput is raised by
# adding a queue, not by raising max_concurrency. Light verify jobs are
# the exception (see the verify queues below): they wait on the network,
# not on the thread or the budget.
#
# The bindings of one kind are POST_Q, POST_Q2, POST_Q3, ... (VERIFY_Q,
# VERIFY_Q2, ...), 8 at most, numbered without a gap: the Worker refuses
# to start with POST_Q3 bound and POST_Q2 not. An extent's jobs always go
# to the same queue of a kind (by a hash of its id). Jobs without an
# extent (gc, sweeps, the hints that a recovery copy is due) go to AUX_Q,
# and to VERIFY_Q when AUX_Q is not bound. They are many and cheap; in
# VERIFY_Q they stood in front of the verify and release jobs of every
# extent that hashes there (measured: a backlog of 145,000 to 235,000
# messages, and 1,310 of 1,312 overdue verify rows on that one queue).
# Every queue needs its consumer: the extents of a queue nobody reads are
# never posted.
# To add a queue: create it, then add its producer and its consumer here.
# To take one away: remove the producer with the highest number, and its
# consumer only when the queue is empty (the cron run sends a due
# extent's job again, to a queue that is still bound, so a job left
# behind delays its extent and loses nothing). While SAFETY_MIN_AGE_SECS
# is above 0, or extents released under an earlier value still wait, a
# verify queue also holds the delayed wake-ups of extents that wait for
# their minimum age, so it is rarely empty; the same holds for those.
[[queues.producers]]
binding = "POST_Q"
queue = "velmora-post"

[[queues.producers]]
binding = "POST_Q2"
queue = "velmora-post2"

[[queues.producers]]
binding = "POST_Q3"
queue = "velmora-post3"

[[queues.producers]]
binding = "POST_Q4"
queue = "velmora-post4"

[[queues.producers]]
binding = "POST_Q5"
queue = "velmora-post5"

[[queues.producers]]
binding = "POST_Q6"
queue = "velmora-post6"

[[queues.producers]]
binding = "POST_Q7"
queue = "velmora-post7"

[[queues.producers]]
binding = "POST_Q8"
queue = "velmora-post8"

[[queues.producers]]
binding = "VERIFY_Q"
queue = "velmora-verify"

[[queues.producers]]
binding = "VERIFY_Q2"
queue = "velmora-verify2"

[[queues.producers]]
binding = "VERIFY_Q3"
queue = "velmora-verify3"

[[queues.producers]]
binding = "VERIFY_Q4"
queue = "velmora-verify4"

# Create this queue before the deploy that binds it:
#   npx wrangler queues create velmora-aux
[[queues.producers]]
binding = "AUX_Q"
queue = "velmora-aux"

# The post queues. max_concurrency is a secondary bound; provider_permits
# is the real gate. The measured providers limit the source addresses an
# account may connect from at once, not only its connections. A provider's
# `max_ips` (in NNTP_PROVIDERS) is that limit: at most so many jobs and
# requests hold connections there at once, and `max_conns` bounds the
# connections they hold together. A job without a slot, refused at login,
# or without room in the isolate's byte budget is deferred, not failed,
# and comes back after 15 to 59 s. Three per queue is what the job budget
# holds (see POST_SOCKETS above).
[[queues.consumers]]
queue = "velmora-post"
max_batch_size = 1
max_concurrency = 3
max_retries = 20
retry_delay = 60
dead_letter_queue = "velmora-dlq"

[[queues.consumers]]
queue = "velmora-post2"
max_batch_size = 1
max_concurrency = 3
max_retries = 20
retry_delay = 60
dead_letter_queue = "velmora-dlq"

[[queues.consumers]]
queue = "velmora-post3"
max_batch_size = 1
max_concurrency = 3
max_retries = 20
retry_delay = 60
dead_letter_queue = "velmora-dlq"

[[queues.consumers]]
queue = "velmora-post4"
max_batch_size = 1
max_concurrency = 3
max_retries = 20
retry_delay = 60
dead_letter_queue = "velmora-dlq"

[[queues.consumers]]
queue = "velmora-post5"
max_batch_size = 1
max_concurrency = 3
max_retries = 20
retry_delay = 60
dead_letter_queue = "velmora-dlq"

[[queues.consumers]]
queue = "velmora-post6"
max_batch_size = 1
max_concurrency = 3
max_retries = 20
retry_delay = 60
dead_letter_queue = "velmora-dlq"

[[queues.consumers]]
queue = "velmora-post7"
max_batch_size = 1
max_concurrency = 3
max_retries = 20
retry_delay = 60
dead_letter_queue = "velmora-dlq"

[[queues.consumers]]
queue = "velmora-post8"
max_batch_size = 1
max_concurrency = 3
max_retries = 20
retry_delay = 60
dead_letter_queue = "velmora-dlq"

# The verify queues. A verify job holds one connection. The full read of
# an extent (16 MiB) takes about 14 s and more than a second of CPU, so
# the read rate is about 1 MiB/s for every job that runs: measured about
# 9 MiB/s with two queues of eight, about 14 MiB/s with four queues of
# six, where the reading provider's slots became the limit.
# Under VERIFY_MODE=light a job asks for the extent's articles together
# and charges 2 MiB to the job budget, with about 45 ms of CPU and 6 to
# 7 s of wall time per invocation. Four queues of six then ran all 24
# consumers all the time and verified about 19 MiB/s, below the 30 MiB/s
# posted, while the reading provider used 13 to 18 of its 19 background
# holders. Release jobs share these consumers and that provider. Eight
# per queue is sized for light only and is the step those holders allow:
# past about 30 consumers verify and release jobs are put off instead of
# running, and every put-off spends one of the message's deliveries
# (max_retries). Under body the provider's slots already bound at six.
[[queues.consumers]]
queue = "velmora-verify"
max_batch_size = 1
max_concurrency = 8
max_retries = 20
retry_delay = 120
dead_letter_queue = "velmora-dlq"

[[queues.consumers]]
queue = "velmora-verify2"
max_batch_size = 1
max_concurrency = 8
max_retries = 20
retry_delay = 120
dead_letter_queue = "velmora-dlq"

[[queues.consumers]]
queue = "velmora-verify3"
max_batch_size = 1
max_concurrency = 8
max_retries = 20
retry_delay = 120
dead_letter_queue = "velmora-dlq"

[[queues.consumers]]
queue = "velmora-verify4"
max_batch_size = 1
max_concurrency = 8
max_retries = 20
retry_delay = 120
dead_letter_queue = "velmora-dlq"

# The queue of the jobs without an extent. They hold no extent bytes and
# most take under a second, so one queue is enough.
[[queues.consumers]]
queue = "velmora-aux"
max_batch_size = 1
max_concurrency = 6
max_retries = 20
retry_delay = 120
dead_letter_queue = "velmora-dlq"

[triggers]
crons = ["*/5 * * * *"]

# secrets (wrangler secret put, value on stdin): VELMORA_KEK_1, NNTP_PROVIDERS, ADMIN_TOKEN
# NNTP_PROVIDERS refuses unknown fields: deploy a Worker before the secret uses a new provider field
# (`hosts`, `host_select`, `release`, `proxies`), and take such fields out of the secret before rolling the Worker back.
# `release` (true when absent) says whether a provider's backbone counts toward releasing the pinned
# copy. A backbone with `"release": false` on any of its providers is posted to and read from, but is
# neither verified nor counted: use it for short-retention or post-only accounts. A release needs
# every article read in full (BODY) on one backbone that counts and present (STAT) on
# REQUIRED_BACKBONES of them in all; BODY goes to the first one in the list, so list the account to
# read in full first. The BODY read happens once, at verify. The release, after SAFETY_MIN_AGE_SECS,
# reads no BODY: it asks every backbone that counts for every article with STAT, and needs the BODY
# pass of the current article plan on record for one of the backbones that answer (an operator
# decision: it halves the read volume; a body a backbone stopped serving in between, while it still
# answers STAT, is not seen by the release).
# `release` is true when absent, so a short-retention provider MUST say
# `"release": false`. With fewer readable backbones that count than REQUIRED_BACKBONES the Worker keeps
# serving reads and writes and releases nothing: every pinned copy stays held, /_admin/status lists a
# "release paused" line under `config_warnings`, and the cron logs it on every tick.
#
# A provider's `proxies` (in NNTP_PROVIDERS) is a list of SOCKS5 proxies,
# each {"host", "port", "user", "pass"}, tried in order. Every connection
# to that provider then goes through one of them, so the provider sees
# the proxy's address and not the changing address of each invocation.
# TLS runs from the Worker to the provider inside the proxied connection:
# the proxy relays ciphertext and never sees the provider login. On this
# route the Worker makes TLS itself and checks the certificate against
# the provider's host name and the public roots, so that host must be a
# DNS name (a direct connection keeps the runtime's TLS). The
# proxy login itself is sent to the proxy in clear (RFC 1929), so it
# guards the use of the proxy and nothing else. A provider with `proxies`
# is never connected directly: with every proxy down it is unhealthy
# (`proxy_failed` in /status, `route` = "proxy") and its jobs wait, as
# for a cooling provider, without spending attempts. `proxies` needs
# `tls: true`, and a list that is there must not be empty. All the
# proxies of a provider may be in use at the same time, so `proxies`
# needs `max_ips` too, the number of addresses the provider allows, and
# a `proxies` list longer than it is refused. `max_ips` goes on counting
# invocations, which is never the looser count.
#
# A provider may state `drill_conns` (default 0): connections more than
# `max_conns`, for the read-back drill (`POST /_admin/drill`) only. They
# are slots of their own, so a drill that holds all of them takes none
# from a read or a job, and no read or job is handed one. The provider
# counts them like any connection: `max_conns` plus `drill_conns` must
# stay within what the account allows at once. They are outside `pool`
# as well: where providers share one account limit, that limit must hold
# the pool's own and the `drill_conns` of every provider in it. Without
# `drill_conns` on any provider a drill reads over one connection, as a
# cold read does.
# `drill_conns` needs `read`, and on an account with `max_ips` it needs
# `proxies`: a direct drill connection would be one more address. Deploy
# the Worker that knows the field before NNTP_PROVIDERS carries it: an
# older one refuses a list with a field it does not know. A provider `id`
# may not end in `/drill` (the name the drill's slots are kept under):
# this Worker refuses a list with such an id, with or without the field.

[env.dev]
vars = { ENVIRONMENT = "dev", S3_HOST = "127.0.0.1:8787", REQUIRED_BACKBONES = "1", SAFETY_MIN_AGE_SECS = "0", RELEASE_AT_VERIFY = "on", VERIFY_DELAY_SECS = "1", DEV_TRUST_HTTP = "1", NEWSGROUPS = "alt.binaries.test", MAX_EXTENT_BYTES = "16777216", S3_REGION = "auto", VELMORA_KEK_ACTIVE = "1", INFLIGHT_BUDGET_BYTES = "50331648", GC_MODE = "disposable", MAINTENANCE = "off", SERVER_SIDE_COPY = "on", PACKED_PLANS = "on", MAX_PUT_BYTES = "103809024", INTENT_SWEEP = "on", GET_FANOUT_BYTES = "8388608", PERMITS = "d1" }
# dev secrets come from workers/s3-bridge/.dev.vars (gitignored; see .dev.vars.example).

# An environment inherits [placement]; dev runs where it is called.
[env.dev.placement]
mode = "off"
# Environments do not inherit bindings, so dev repeats them all, under
# its own resource names (-dev) so a dev run can never touch prod data.

[[env.dev.analytics_engine_datasets]]
binding = "METRICS"
dataset = "velmora_requests_dev"

[[env.dev.services]]
binding = "SELF"
service = "velmora-s3-dev"

# The permit gate, declared and bound in dev (the CI end-to-end run
# takes its permits from it with PERMITS = "do"). Production declares
# and binds the class above [[d1_databases]] (see the comment there).
[env.dev.exports.PermitGate]
type = "durable-object"
storage = "sqlite"

[[env.dev.durable_objects.bindings]]
name = "PERMIT_GATE"
class_name = "PermitGate"

[env.dev.version_metadata]
binding = "CF_VERSION_METADATA"

[[env.dev.d1_databases]]
binding = "CATALOG"
database_name = "velmora-catalog-dev"
database_id = "<from wrangler d1 create>"
migrations_dir = "migrations"

[[env.dev.r2_buckets]]
binding = "SAFETY"
bucket_name = "velmora-safety-dev"

[[env.dev.r2_buckets]]
binding = "CACHE"
bucket_name = "velmora-cache-dev"

[[env.dev.queues.producers]]
binding = "POST_Q"
queue = "velmora-post-dev"

[[env.dev.queues.producers]]
binding = "VERIFY_Q"
queue = "velmora-verify-dev"

[[env.dev.queues.consumers]]
queue = "velmora-post-dev"
max_batch_size = 1
max_concurrency = 2
max_retries = 20
retry_delay = 60
dead_letter_queue = "velmora-dlq-dev"

[[env.dev.queues.consumers]]
queue = "velmora-verify-dev"
max_batch_size = 1
max_concurrency = 2
max_retries = 20
retry_delay = 120
dead_letter_queue = "velmora-dlq-dev"
