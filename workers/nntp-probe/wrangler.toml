name = "velmora-nntp-probe"
main = "build/worker/shim.mjs"
compatibility_date = "2026-11-01"
workers_dev = true

# Account id comes from the deploy environment (CLOUDFLARE_ACCOUNT_ID),
# never from this file. Secrets (PROBE_TOKEN, and per account NNTP_P<n>_HOST,
# _PORT, _USER, _PASS and optional _ALT; or the single-account NNTP_HOST,
# NNTP_PORT, NNTP_USER, NNTP_PASS) are set with `wrangler secret put` or
# `wrangler secret bulk` on stdin; see README.md.

[build]
command = "worker-build --release"

[vars]
# Posting allow-list (comma-separated). Group names only, no credentials.
NEWSGROUPS = "alt.binaries.test"

# A second deployment pinned near a region, to measure from there:
# `wrangler deploy --env us`. Secrets are per deployment. The response header
# `cf-placement` names the data centre the invocation ran in; `x-probe-colo`
# is then the data centre the request entered at.
[env.us]
name = "velmora-nntp-probe-us"

[env.us.placement]
region = "aws:us-east-1"

[env.us.vars]
NEWSGROUPS = "alt.binaries.test"
