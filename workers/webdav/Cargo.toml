[package]
name = "velmora-webdav"
version = "0.1.0"
edition = "2021"
# The locked Worker SDK (worker 0.8.7) requires Rust 1.91.
rust-version = "1.91"
description = "Cloudflare Worker for the WebDAV gateway: thin adapters from Workers bindings to the velmora-dav ports"
license = "MIT"
repository = "https://github.com/TogetherWeOwn/velmora"
publish = false

[lib]
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
velmora-dav = { version = "0.1.0", path = "../../crates/velmora-dav" }
worker = { version = "0.8" }
serde_json = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
