name = "velmora-webdav"
main = "build/worker/shim.mjs"
compatibility_date = "2026-11-01"

# The account id comes from the deploy environment (CLOUDFLARE_ACCOUNT_ID),
# never from this file.
#
# No route and no custom domain here: the WebDAV hostname is attached by
# the operator once this Worker is approved for use. No workers.dev URL
# and no preview URLs: WebDAV clients log in with Basic, and the only
# place they may send it is the WebDAV hostname.
workers_dev = false
preview_urls = false

[build]
# worker-build 0.8.7 matches the locked workers-rs 0.8.7.
command = "cargo install -q --locked worker-build@0.8.7 && worker-build --release"

# Run next to the storage Worker (placed in aws:us-east-1, next to D1 and
# R2): a WebDAV request is several S3 calls in a row, and each one then
# stays inside the region. The state objects are created from here and
# so live there too.
[placement]
mode = "targeted"
region = "aws:us-east-1"

[vars]
# The storage Worker's S3_HOST: every S3 call is signed for it. Written
# by the deploy from the production value; this placeholder fails every
# signature until then.
S3_HOST = "s3.invalid"
S3_REGION = "auto"

# The storage Worker's WebDAV entry point: the one entry point that
# accepts app passwords (velmora-s3 entry.mjs, DavEntry).
[[services]]
binding = "STORAGE"
service = "velmora-s3"
entrypoint = "DavEntry"

# Locks, write leases and dead properties: one object per bucket.
# Declaring a class is a deploy that cannot be rolled back past; this is
# the first deploy of this Worker, so it comes with it.
[exports.DavState]
type = "durable-object"
storage = "sqlite"

[[durable_objects.bindings]]
name = "DAV_STATE"
class_name = "DavState"

# Local development and the end-to-end test (e2e/dav.sh), against the
# storage Worker's dev environment. Environments inherit nothing that
# binds, so dev repeats it.
[env.dev]
vars = { S3_HOST = "127.0.0.1:8787", S3_REGION = "auto" }

[env.dev.placement]
mode = "off"

[[env.dev.services]]
binding = "STORAGE"
service = "velmora-s3-dev"
entrypoint = "DavEntry"

[env.dev.exports.DavState]
type = "durable-object"
storage = "sqlite"

[[env.dev.durable_objects.bindings]]
name = "DAV_STATE"
class_name = "DavState"
