[package]
name = "velmora-pg-load"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
futures-channel = "0.3"
futures-util = { version = "0.3", default-features = false, features = ["std", "async-await"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
velmora-bridge = { version = "0.1.0", path = "../../crates/velmora-bridge", features = ["pg"] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["rt", "net", "time"] }
tokio-postgres = { version = "=0.7.18", default-features = false, features = ["runtime"] }
velmora = { version = "0.1.0", path = "../../crates/velmora", default-features = false }

[target.'cfg(target_arch = "wasm32")'.dependencies]
subtle = "2"
tokio = { version = "1", default-features = false, features = ["io-util"] }
velmora = { version = "0.1.0", path = "../../crates/velmora", default-features = false, features = ["worker-transport"] }
tokio-postgres = { version = "=0.7.18", default-features = false, features = ["js"] }
worker = { version = "0.8", features = ["tokio-postgres"] }
