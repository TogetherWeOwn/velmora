[package]
name = "velmora-kit"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Native tooling for sealed Velmora recovery-kit indexes"
license = "MIT"
repository = "https://github.com/TogetherWeOwn/velmora"
publish = false

[dependencies]
velmora = { version = "0.1.0", path = "../velmora", default-features = false }
velmora-bridge = { version = "0.1.0", path = "../velmora-bridge" }
chacha20poly1305 = { version = "0.11", default-features = false, features = ["zeroize"] }
ciborium = "0.2"
hkdf = "0.13"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
serde_json = "1"
sha2 = "0.11"
tar = { version = "0.4", default-features = false }
zeroize = "1"
zstd = "0.13"
