[package]
name = "velmora"
version = "0.1.0"
edition = "2021"
description = "Shared Usenet data-plane engine: NNTP client, yEnc, NZB, velmora.media.v1 encryption, par2 verify (native + wasm32)"
license = "MIT"
repository = "https://github.com/TogetherWeOwn/velmora"
rust-version = "1.89"

[features]
default = ["native-tls"]
native-tls = ["dep:tokio", "dep:tokio-rustls", "dep:rustls", "dep:webpki-roots", "dep:ring", "dep:rustls-pki-types", "dep:velmora-ssrf-guard"]
worker-transport = ["dep:worker", "dep:futures-util", "dep:tokio"]
# Qualification-only; no runtime call site is enabled by this feature.
worker-pinned-tls = ["worker-transport", "dep:tokio-rustls", "dep:rustls", "dep:webpki-roots", "dep:ring", "dep:rustls-pki-types", "dep:velmora-ssrf-guard"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crc32fast = "1"
quick-xml = "0.42"
sha2 = "0.11"
md5 = "0.8"
# velmora.media.v1 (format decision §1.6): stable releases only, matching
# the sha2 0.11 / digest 0.11 generation. No getrandom: keys and nonces come
# in through `rng::FillRandom`.
chacha20poly1305 = { version = "0.11", default-features = false, features = ["zeroize"] }
hkdf = "0.13"
# `zeroize`: wipes the HKDF PRK and HMAC state on drop.
hmac = { version = "0.13", features = ["zeroize"] }
subtle = { version = "2", default-features = false }
zeroize = "1"
# Posting obfuscation mints randomness in this crate (`rng::SystemRng`).
# The `js` feature is the wasm32-unknown-unknown backend (Workers posting
# path); on native targets it selects the OS backend as usual.
getrandom = { version = "0.2", features = ["js"] }
tokio-rustls = { version = "0.26", optional = true, default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", optional = true, default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = { version = "1", optional = true }
worker = { version = "0.8", optional = true }
futures-util = { version = "0.3", optional = true }
velmora-ssrf-guard = { version = "0.1.0", path = "../velmora-ssrf-guard", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["io-util", "net", "time"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio = { version = "1", features = ["io-util"], optional = true }
ring = { version = "0.17", optional = true, features = ["wasm32_unknown_unknown_js"] }
rustls-pki-types = { version = "1", optional = true, features = ["web"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
criterion = "0.8"
# Inflates the zlib-compressed C2SP CCTV age vectors (`cctv_age_stream_vectors`
# in src/media.rs).
miniz_oxide = "0.8"

[[bench]]
name = "yenc"
harness = false

[[bench]]
name = "par2_nzb"
harness = false

[[bench]]
name = "par2_create"
harness = false

[lib]
name = "velmora"
path = "src/lib.rs"
