[package]
name = "velmora-bridge"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Runtime-agnostic core of the velmora S3 bridge: S3 handlers, catalogue, posting outbox and verification, generic over storage, queue and NNTP ports"
license = "MIT"
repository = "https://github.com/TogetherWeOwn/velmora"
publish = false

[lib]
name = "velmora_bridge"
path = "src/lib.rs"

[features]
# Native test doubles (`testkit`): rusqlite-backed `Sql`, in-memory blobs,
# fixed clock, fake job sink, test KEK. Never enabled in the Worker build.
testkit = ["dep:rusqlite"]
pg = ["dep:tokio-postgres", "dep:bytes"]
# Native/drill-only negative control. Never enable in the S3 Worker.
pg-test-unlocked = ["pg"]
pg-test-record = ["pg"]
testkit-pg = ["testkit", "pg", "tokio-postgres/runtime", "dep:tokio", "dep:native-tls", "dep:postgres-native-tls"]

# Every dependency the bridge lanes need is declared here once (the manifest
# is frozen with the contract). Engine features stay off: the Worker crate
# enables `worker-transport`, native tests enable `native-tls`.
[dependencies]
velmora = { version = "0.1.0", path = "../velmora", default-features = false }
velmora-s3-proto = { version = "0.1.0", path = "../velmora-s3-proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
base64 = "0.22"
chacha20poly1305 = { version = "0.11", default-features = false, features = ["zeroize"] }
hkdf = "0.13"
hmac = { version = "0.13", features = ["zeroize"] }
sha2 = "0.11"
md5 = "0.8"
# The drill hands a running MD5 from one request to the next; `md5` has no
# state that can leave the process.
md_5 = { package = "md-5", version = "0.11", default-features = false }
subtle = { version = "2", default-features = false }
zeroize = "1"
rusqlite = { version = "0.42", features = ["bundled", "preupdate_hook"], optional = true }
quick-xml = "=0.42.0"
bytes = { version = "1", optional = true }
tokio-postgres = { version = "=0.7.18", default-features = false, optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
tokio-postgres = { version = "=0.7.18", default-features = false, features = ["js"], optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tokio = { version = "1", features = ["rt", "net"], optional = true }
native-tls = { version = "0.2", optional = true }
postgres-native-tls = { version = "0.5", optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tokio-postgres = { version = "=0.7.18", default-features = false, features = ["runtime"] }

[dev-dependencies]
# Self dev-dependency: integration tests get the testkit feature.
velmora-bridge = { version = "0.1.0", path = ".", features = ["testkit"] }
velmora = { version = "0.1.0", path = "../velmora", default-features = false, features = ["native-tls"] }
velmora-test-nntp = { version = "0.1.0", path = "../velmora-test-nntp" }
tokio = { version = "1", features = ["rt", "macros", "time", "net", "io-util", "sync"] }
