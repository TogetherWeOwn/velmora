[package]
name = "velmora-bridge"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
description = "Runtime-agnostic core of the velmora S3 bridge: S3 handlers, catalogue, posting outbox and verification, generic over storage, queue and NNTP ports"
license = "MIT"
repository = "https://github.com/TogetherWeOwn/velmora"
publish = false

[lib]
name = "velmora_bridge"
path = "src/lib.rs"

[features]
# Native test doubles (`testkit`): rusqlite-backed `Sql`, in-memory blobs,
# fixed clock, fake job sink, test KEK. Never enabled in the Worker build.
testkit = ["dep:rusqlite"]

# Every dependency the bridge lanes need is declared here once (the manifest
# is frozen with the contract). Engine features stay off: the Worker crate
# enables `worker-transport`, native tests enable `native-tls`.
[dependencies]
velmora = { version = "0.1.0", path = "../velmora", default-features = false }
velmora-s3-proto = { version = "0.1.0", path = "../velmora-s3-proto" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
base64 = "0.22"
chacha20poly1305 = { version = "0.11", default-features = false, features = ["zeroize"] }
hkdf = "0.13"
hmac = { version = "0.13", features = ["zeroize"] }
sha2 = "0.11"
md5 = "0.8"
subtle = { version = "2", default-features = false }
zeroize = "1"
rusqlite = { version = "0.42", features = ["bundled"], optional = true }

[dev-dependencies]
# Self dev-dependency: integration tests get the testkit feature.
velmora-bridge = { version = "0.1.0", path = ".", features = ["testkit"] }
velmora = { version = "0.1.0", path = "../velmora", default-features = false, features = ["native-tls"] }
velmora-test-nntp = { version = "0.1.0", path = "../velmora-test-nntp" }
tokio = { version = "1", features = ["rt", "macros", "time", "net", "io-util", "sync"] }
